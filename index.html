function getLastSessionData(dayName, exName, currentSets) {
  // Find the last time this specific day was completed
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const completedDates = Object.entries(state.completed)
    .filter(([key, planDay]) => planDay === dayName)
    .map(([key]) => {
      const parts = key.split('-');
      return { key, date: new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2])) };
    })
    .filter(({ date }) => date < today)
    .sort((a, b) => b.date - a.date);

  if (!completedDates.length) return null;

  const lastSession = completedDates[0];
  const k = exKey(dayName, exName);

  // Prefer historical snapshot, fall back to current setLogs
  const historyForEx = state.weightHistory[k];
  const historicalLog = historyForEx && historyForEx[lastSession.key];
  const log = historicalLog || state.setLogs[k];

  const hasWeights = log && log.weights && log.weights.some(w => w);
  const hasReps = log && log.reps && log.reps.some(r => r);
  const hasChecked = log && log.checked && log.checked.some(c => c);
  if (!log || (!hasWeights && !hasReps && !hasChecked)) return null;

  // Calculate stats
  const weights = (log.weights || []).slice(0, currentSets);
  const repsLog = (log.reps || []).slice(0, currentSets);
  const checked = (log.checked || []).slice(0, currentSets);
  const weightValues = weights.map(w => parseFloat(w)).filter(n => !isNaN(n) && n > 0);

  const avgWeight = weightValues.length ? weightValues.reduce((a, b) => a + b, 0) / weightValues.length : 0;
  const completedSets = checked.filter(Boolean).length;
  const allComplete = completedSets === currentSets;

  // Calculate days ago
  const daysAgo = Math.floor((today - lastSession.date) / (1000 * 60 * 60 * 24));
  const dateStr = daysAgo === 7 ? '7 days ago' : (daysAgo === 1 ? 'yesterday' : `${daysAgo} days ago`);

  // Build reps display — show actual logged reps if no weight
  let repsDisplay;
  if (hasWeights) {
    repsDisplay = weights.map((w, i) => w ? (checked[i] ? '✓' : '○') : (repsLog[i] ? repsLog[i] + ' reps' : '—')).join(', ');
  } else if (hasReps) {
    repsDisplay = repsLog.map((r, i) => r ? (checked[i] ? `✓ ${r}` : r + ' reps') : (checked[i] ? '✓' : '—')).join(', ');
  } else {
    repsDisplay = checked.map(c => c ? '✓' : '—').join(', ');
  }

  // Calculate volume
  const day = PLAN[dayName];
  const ex = day?.exercises?.find(e => e.name === exName);
  const repsPerSet = ex ? parseInt((ex.reps || '').toString().split('–')[0]) || 10 : 10;
  const volume = Math.round(weightValues.reduce((sum, w) => sum + (w * repsPerSet), 0));

  // Smart suggestion
  let suggestion = '';
  if (weightValues.length) {
    if (allComplete && avgWeight > 0) {
      const exObj = day?.exercises?.find(e => e.name === exName);
      const weightList = (exObj && exObj.eq && exObj.eq.toLowerCase().includes('kettlebell')) ? KB_WEIGHTS : DB_WEIGHTS;
      const nextWeight = weightList.find(w => w > avgWeight);
      suggestion = nextWeight ? `💡 All sets complete! Ready to try ${nextWeight} lbs today` : `💪 Max weight! Consider adding reps or slowing tempo`;
    } else if (completedSets > 0 && completedSets < currentSets) {
      suggestion = `💡 Keep ${avgWeight.toFixed(2)} lbs, aim for all ${currentSets} sets today`;
    } else if (completedSets === 0) {
      suggestion = `💡 Last time was challenging — consider ${avgWeight.toFixed(2)} lbs or lighter`;
    }
  } else if (hasReps) {
    const avgReps = repsLog.filter(r => r).map(Number).reduce((a, b) => a + b, 0) / repsLog.filter(r => r).length;
    suggestion = allComplete ? `💡 Last time: ~${Math.round(avgReps)} reps/set — try to match or beat it` : `💡 Aim to complete all ${currentSets} sets`;
  } else if (hasChecked) {
    suggestion = allComplete ? `💡 All ${currentSets} sets done last time — keep it up!` : `💡 Got ${completedSets}/${currentSets} last time — aim for all ${currentSets} today`;
  }

  return {
    date: lastSession.date,
    dateStr,
    daysAgo,
    weight: avgWeight > 0 ? avgWeight.toFixed(2) : null,
    weights,
    reps: repsLog,
    repsDisplay,
    completedSets,
    totalSets: currentSets,
    allComplete,
    volume,
    suggestion
  };
}

function getLastCompletedDateForDay(planDay) {
  // Find the most recent completed date for this plan day (excluding today)
  const tKey = todayKey();
  return Object.keys(state.completed)
    .filter(k => k !== tKey && state.completed[k] === planDay)
    .sort().reverse()[0] || null;
}

function buildSkippedExercisesBanner(planDay) {
  const lastDateKey = getLastCompletedDateForDay(planDay);
  if (!lastDateKey) return '';
  const day = PLAN[planDay];

  const skipped = day.exercises.filter(ex => {
    const snapKey = lastDateKey + '__' + planDay + '__' + ex.name;
    // Only show as skipped if we have a snapshot and it's explicitly false
    return state.completedExercises[snapKey] === false;
  }).map(ex => ex.name);

  if (!skipped.length) return '';

  const color = day.color;
  return `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:10px 14px;margin-bottom:12px">

function buildLastSessionPreview(dayName, exName, numSets, color) {

const DB_WEIGHTS = [6.5, 12, 17.5, 22.5];
const KB_WEIGHTS = [5, 10.5, 16, 23];
const BAND_COLORS = [
  { label: 'Yellow',  value: 'Yellow',  range: '5–15 lbs',   hex: '#eab308' },
  { label: 'Black',   value: 'Black',   range: '15–35 lbs',  hex: '#6b7280' },

];

function buildMasterWeightSelector(k, numSets, equipment) {
  if (!equipment || (!equipment.includes('DB') && !equipment.toLowerCase().includes('band') && !equipment.toLowerCase().includes('kettlebell'))) {
    return '';
  }

  const isBand = equipment.toLowerCase().includes('band');
  const isKB = equipment.toLowerCase().includes('kettlebell');

  if (isBand) {
    const buttons = BAND_COLORS.map(b =>
      `<button class="weight-btn" style="border-color:${b.hex};color:${b.hex}" onclick="setAllWeights('${k}',${numSets},'${b.value}')">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${b.hex};margin-right:4px;vertical-align:middle"></span>${b.label}<span style="font-size:9px;opacity:0.6;margin-left:4px">${b.range}</span>
      </button>`
    ).join('');
    return `<div style="margin-bottom:8px">
      <div style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">Band color for all sets</div>
      <div class="weight-quick-select">${buttons}</div>
    </div>`;
  }

  const weights = isKB ? KB_WEIGHTS : DB_WEIGHTS;
  const label = isKB ? 'Kettlebell weight for all sets' : 'Set weight for all sets';
  const buttons = weights.map(w =>
    `<button class="weight-btn" onclick="setAllWeights('${k}',${numSets},${w})">${w} lbs</button>`
  ).join('');

  return `<div style="margin-bottom:8px">
    <div style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">${label}</div>
    <div class="weight-quick-select">${buttons}</div>
  </div>`;
}

function setAllWeights(k, numSets, weight) {
  // Handle phase exercise keys (e.g., "Monday__Pull-up Bar Work-ex0")
  const baseKey = k.replace(/-ex\d+$/, ''); // Remove "-ex0", "-ex1" etc. if present
  const isPhaseEx = k !== baseKey;

  if (isPhaseEx) {
    // For phase exercises, we need to find the offset for this specific exercise
    const exMatch = k.match(/-ex(\d+)$/);
    if (!exMatch) return;

    const exIdx = parseInt(exMatch[1]);

    // Get total sets before this exercise to calculate offset
    const parts = baseKey.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const day = PLAN[dayName];
    const exercise = day?.exercises?.find(e => e.name === exName);

    if (exercise?.progression) {
      const prog = getProgressionPhase(exercise.progression);
      const phases = exercise.progression === 'pullup' ? PULLUP_PHASES : exercise.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
      const phase = phases[prog.phaseIndex];
      const phaseSetCounts = phase.exercises.map(pe => parseInt(pe.sets) || 3);
      const offset = phaseSetCounts.slice(0, exIdx).reduce((a, b) => a + b, 0);

      // Ensure log exists
      const totalPhaseSets = phaseSetCounts.reduce((a, b) => a + b, 0);
      if (!state.setLogs[baseKey]) {
        state.setLogs[baseKey] = { checked: Array(totalPhaseSets).fill(false), weights: Array(totalPhaseSets).fill(''), reps: Array(totalPhaseSets).fill('') };
      }

      // Set weights for this phase exercise's sets
      for (let i = 0; i < numSets; i++) {
        const fi = offset + i;
        state.setLogs[baseKey].weights[fi] = weight.toString();
        const input = document.getElementById(`weight-input-${baseKey}-${fi}`);
        if (input) input.value = weight;
      }
    }
  } else {
    // Standard exercise
    if (!state.setLogs[k]) {
      const parts = k.split('__');
      const dayName = parts[0];
      const exName = parts.slice(1).join('__');
      state.setLogs[k] = { checked: Array(numSets).fill(false), weights: Array(numSets).fill(''), reps: Array(numSets).fill('') };
    }

    // Set all weights to the selected value
    for (let i = 0; i < numSets; i++) {
      state.setLogs[k].weights[i] = weight.toString();
      const input = document.getElementById(`weight-input-${k}-${i}`);
      if (input) input.value = weight;
    }
  }

  saveSetLogs();
}

function toggleSetWeightPicker(k, idx) {
  const picker = document.getElementById(`set-picker-${k}-${idx}`);
  if (!picker) return;

  // Close all other pickers
  document.querySelectorAll('.set-weight-picker.open').forEach(p => {
    if (p !== picker) p.classList.remove('open');
  });

  picker.classList.toggle('open');
}

function setIndividualWeight(k, idx, weight) {
  if (!state.setLogs[k]) {
    const parts = k.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const sets = getExSetsCount(dayName, exName);
    state.setLogs[k] = { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
  }

  state.setLogs[k].weights[idx] = weight.toString();
  const input = document.getElementById(`weight-input-${k}-${idx}`);
  if (input) input.value = weight;

  // Close picker
  const picker = document.getElementById(`set-picker-${k}-${idx}`);
  if (picker) picker.classList.remove('open');

  saveSetLogs();
}

const MUSCLE_GROUPS = {
  'Chest': { color: '#FF6B35', days: ['Monday','Friday'] },
  'Shoulders': { color: '#F59E0B', days: ['Monday','Wednesday','Friday'] },
  'Triceps': { color: '#FF6B35', days: ['Monday','Friday','Saturday'] },
  'Back': { color: '#A78BFA', days: ['Wednesday','Friday'] },
  'Biceps': { color: '#A78BFA', days: ['Wednesday','Saturday'] },
  'Quads': { color: '#4ECDC4', days: ['Tuesday','Thursday'] },
  'Glutes': { color: '#34D399', days: ['Tuesday','Thursday'] },
  'Hamstrings': { color: '#34D399', days: ['Tuesday','Thursday'] },
  'Core': { color: '#60B8FF', days: ['Tuesday','Thursday','Saturday'] },
  'Arms': { color: '#F472B6', days: ['Monday','Wednesday','Friday','Saturday'] },
};

function buildMuscleHeatmap(weekStart) {
  const hits = {};
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const key = dateKey(d);
    if (state.completed[key]) {
      const planDay = state.completed[key];
      Object.entries(MUSCLE_GROUPS).forEach(([muscle, info]) => {
        if (info.days.includes(planDay)) {
          hits[muscle] = (hits[muscle] || 0) + 1;
        }
      });
    }
  }
  return hits;
}

function buildHeatmapHTML(hits) {
  const muscles = Object.keys(MUSCLE_GROUPS);
  const maxHits = Math.max(1, ...Object.values(hits));
  const bars = muscles.map(m => {
    const count = hits[m] || 0;
    const pct = count / maxHits;
    const color = MUSCLE_GROUPS[m].color;
    const opacity = count === 0 ? 0.12 : 0.3 + pct * 0.7;
    return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="width:72px;font-size:11px;color:rgba(255,255,255,${count > 0 ? '0.7' : '0.3'});text-align:right;flex-shrink:0">${m}</div>
      <div style="flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.07);overflow:hidden">
        <div style="height:100%;width:${count > 0 ? Math.max(pct * 100, 15) : 0}%;background:${color};border-radius:4px;opacity:${opacity};transition:width 0.4s"></div>
      </div>
      <div style="width:16px;font-size:10px;color:${count > 0 ? color : 'rgba(255,255,255,0.2)'};font-weight:700;flex-shrink:0">${count > 0 ? count + 'x' : ''}</div>
    </div>`;
  }).join('');

  const totalHit = Object.keys(hits).length;
  const totalMuscles = muscles.length;

  return `
  <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase">💪 This Week's Muscles</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35)">${totalHit}/${totalMuscles} groups hit</div>
    </div>
    ${bars}
    ${totalHit === 0 ? '<div style="text-align:center;font-size:12px;color:rgba(255,255,255,0.25);padding:10px 0">Complete workouts to see your muscle coverage</div>' : ''}
  </div>`;
}

function setWorkoutOverride(calDay, planDay) {
  const key = todayKey(); // tie override to today's specific date
  if (planDay === calDay) {
    delete state.workoutOverride[key];
  } else {
    state.workoutOverride[key] = planDay;
  }
  saveOverride();
  render();
}

function clearOverride(calDay) {
  const key = todayKey();
  delete state.workoutOverride[key];
  saveOverride();
  render();
}

function saveNoteForDay(dateKey) {
  const el = document.getElementById('session-notes-area');
  if (!el) return;
  state.sessionNotes[dateKey] = el.value;
  saveNotes();
}

function setView(v) {
  if (v === 'workout' && !state.sessionStart) {
    state.sessionStart = Date.now();
    saveSessionStart();
  }
  state.view = v;
  render();
}
function setDay(d) { state.activeDay = d; state.resetConfirm = null; render(); }

function goToToday() { state.activeDay = todayDayName(); state.view = 'workout'; render(); }
function calPrev() { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } render(); }
function calNext() { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } render(); }

function toggleToday() {
  const k = todayKey();
  const calDay = todayDayName();
  const planDay = state.workoutOverride[k] || calDay;
  if (state.completed[k]) {
    // Uncompleting
    delete state.completed[k];
    delete state.sessionDurations[k];
    delete state.volume[k];
    saveCompleted();
    saveDurations();
    saveVolume();
    render();
  } else {
    // Completing - show summary
    state.completed[k] = planDay;
    const elapsed = getSessionElapsed();
    if (elapsed > 0) state.sessionDurations[k] = elapsed;
    // Stop the session timer
    if (sessionTimerInterval) clearInterval(sessionTimerInterval);
    state.sessionPaused = true;
    saveSessionState();
    const vol = computeSessionVolume(planDay);
    if (vol > 0) state.volume[k] = vol;

    // Collect any new PRs from this session
    const day = PLAN[planDay];
    const newPRs = [];
    if (day && day.exercises) {
      day.exercises.forEach(ex => {
        if (ex.progression) return;
        const exKey_ = exKey(planDay, ex.name);
        const prInfo = state.prs[exKey_];
        if (prInfo && prInfo.date === new Date().toLocaleDateString()) {
          newPRs.push(`${ex.name}: ${prInfo.weight} lbs`);
        }
      });
    }

    saveDurations();
    saveVolume();
    saveCompleted();

    // Snapshot which exercises were completed at time of marking done
    if (day && day.exercises) {
      try {
        day.exercises.forEach(ex => {
          const ek = exKey(planDay, ex.name);
          const log = state.setLogs[ek];
          let done = false;
          if (log) {
            if (ex.progression) {
              const phases = ex.progression === 'pullup' ? PULLUP_PHASES : ex.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
              const phase = phases[getProgressionPhase(ex.progression).phaseIndex];
              const psc = phase.exercises.map(pe => parseInt(pe.sets) || 3);
              done = phase.exercises.some((pe, exIdx) => {
                const offset = psc.slice(0, exIdx).reduce((a, b) => a + b, 0);
                return Array.from({length: psc[exIdx]}, (_, s) => log.checked[offset + s]).every(Boolean);
              });
            } else {
              done = log.checked.filter(Boolean).length === ex.sets;
            }
          }
          state.completedExercises[k + '__' + planDay + '__' + ex.name] = done;
        });
        localStorage.setItem(COMPLETED_EX_KEY, JSON.stringify(state.completedExercises));
      } catch(e) {}

      // Snapshot weights for clipboard history
      try {
        day.exercises.forEach(ex => {
          const ek = exKey(planDay, ex.name);
          const log = state.setLogs[ek];
          const hasAny = log && ((log.weights && log.weights.some(w => w)) || (log.reps && log.reps.some(r => r)) || (log.checked && log.checked.some(c => c)));
          if (hasAny) {
            if (!state.weightHistory[ek]) state.weightHistory[ek] = {};
            state.weightHistory[ek][k] = { weights: [...(log.weights || [])], reps: [...(log.reps || [])], checked: [...(log.checked || [])] };
          }
        });
        saveWeightHistory();
      } catch(e) {}
    }

    // Show completion modal
    showCompletionSummary(planDay, elapsed, vol, newPRs);

    render();
  }
}

function calToggle(key, dayName) {
  const tKey = todayKey();

  if (key !== tKey && state.completed[key]) {
    // Past completed day — show detail modal
    showDayDetail(key, planDay);

  if (state.completed[key]) {
    delete state.completed[key];
  } else {
    state.completed[key] = planDay;

  render();
}

  const day = PLAN[planDay];
  const color = day ? day.color : '#60B8FF';
  const label = day ? day.label : 'Active Recovery';
  const dur = state.sessionDurations[key];
  const vol = state.volume[key];
  const note = state.sessionNotes[key] || '';
  const dateStr = (() => {
    const parts = key.split('-');
    const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));

  let exerciseRows = '';

    <div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:16px">${label}</div>

      ${dur ? `<div style="flex:1;background:rgba(255,255,255,0.05);border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:800;color:${color}">${Math.floor(dur/60)}m</div><div style="font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase">Duration</div></div>` : ''}
      ${vol ? `<div style="flex:1;background:rgba(255,255,255,0.05);border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:800;color:${color}">${Math.round(vol)}</div><div style="font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase">lbs lifted</div></div>` : ''}
    </div>
    ${exerciseRows ? `<div style="margin-bottom:12px">${exerciseRows}</div>` : ''}
    <div style="margin-top:8px">
      <div style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">Session Note</div>

        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:12px;padding:10px;outline:none;font-family:'DM Sans',sans-serif;resize:none;box-sizing:border-box">${note}</textarea>

    </div>

function openProgressChart(dayEncoded, exEncoded) {
  const dayName = decodeURIComponent(dayEncoded);
  const exName  = decodeURIComponent(exEncoded);
  const k = exKey(dayName, exName);
  const history = state.weightHistory[k] || {};

  // Gather all sessions sorted by date
  const sessions = Object.entries(history)
    .map(([dateKey, log]) => {
      const parts = dateKey.split('-');
      const date = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
      const weights = (log.weights || []).map(w => parseFloat(w)).filter(n => !isNaN(n) && n > 0);
      const reps = (log.reps || []).map(r => parseFloat(r)).filter(n => !isNaN(n) && n > 0);
      const avgW = weights.length ? weights.reduce((a,b) => a+b,0) / weights.length : null;
      const avgR = reps.length ? reps.reduce((a,b) => a+b,0) / reps.length : null;
      const label = date.toLocaleDateString('en-US', { month:'short', day:'numeric' });
      return { date, label, avgW, avgR, weights, reps };
    })
    .sort((a,b) => a.date - b.date);

  // Also include current session if has data
  const curLog = state.setLogs[k];
  if (curLog) {
    const curWeights = (curLog.weights || []).map(w => parseFloat(w)).filter(n => !isNaN(n) && n > 0);
    const curReps = (curLog.reps || []).map(r => parseFloat(r)).filter(n => !isNaN(n) && n > 0);
    if (curWeights.length || curReps.length) {
      const today = new Date();
      const alreadyIn = sessions.find(s => s.date.toDateString() === today.toDateString());
      if (!alreadyIn) {
        const avgW = curWeights.length ? curWeights.reduce((a,b)=>a+b,0)/curWeights.length : null;
        const avgR = curReps.length ? curReps.reduce((a,b)=>a+b,0)/curReps.length : null;
        sessions.push({ date: today, label: 'Today', avgW, avgR, weights: curWeights, reps: curReps });
      }
    }
  }

  const hasWeights = sessions.some(s => s.avgW !== null);
  const hasReps    = sessions.some(s => s.avgR !== null);

  let chartHTML = '';
  if (sessions.length < 2) {
    chartHTML = `<div style="text-align:center;padding:32px 0;color:rgba(255,255,255,0.35);font-size:13px">Log at least 2 sessions<br>to see a progress chart</div>`;
  } else {
    // SVG chart — 320 wide, 130 tall
    const W = 320, H = 120, PAD = { t:12, r:12, b:30, l:36 };
    const iW = W - PAD.l - PAD.r, iH = H - PAD.t - PAD.b;
    const n = sessions.length;

    function makePolyline(values, color) {
      const valid = values.filter(v => v !== null);
      if (!valid.length) return '';
      const min = Math.min(...valid);
      const max = Math.max(...valid);
      const range = max - min || 1;
      const pts = values.map((v, i) => {
        if (v === null) return null;
        const x = PAD.l + (i / (n-1)) * iW;
        const y = PAD.t + iH - ((v - min) / range) * iH;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).filter(Boolean).join(' ');

      const dots = values.map((v, i) => {
        if (v === null) return '';
        const x = PAD.l + (i / (n-1)) * iW;
        const y = PAD.t + iH - ((v - min) / range) * iH;
        const isLast = i === values.length - 1;
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast ? 5 : 3}" fill="${color}" stroke="#14141e" stroke-width="1.5"/>`;
      }).join('');

      // Label first and last
      const firstIdx = values.findIndex(v => v !== null);
      const lastIdx  = values.length - 1 - [...values].reverse().findIndex(v => v !== null);
      const labelDots = [firstIdx, lastIdx].filter((idx, i, arr) => arr.indexOf(idx) === i).map(idx => {
        const v = values[idx];
        if (v === null) return '';
        const x = PAD.l + (idx / (n-1)) * iW;
        const y = PAD.t + iH - ((v - min) / range) * iH;
        const anchor = idx === 0 ? 'start' : 'end';
        const dy = y < PAD.t + 16 ? 14 : -6;
        const display = v % 1 === 0 ? v : v.toFixed(1);
        return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" fill="${color}" font-size="10" text-anchor="${anchor}" font-family="DM Sans,sans-serif">${display}</text>`;
      }).join('');

      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.1"/>
      ${dots}${labelDots}`;
    }

    // X-axis labels (show up to 5, spread evenly)
    const xLabels = sessions.map((s, i) => {
      if (n <= 5 || i === 0 || i === n-1 || i % Math.ceil(n/4) === 0) {
        const x = PAD.l + (i / (n-1)) * iW;
        return `<text x="${x.toFixed(1)}" y="${H - 2}" fill="rgba(255,255,255,0.3)" font-size="9" text-anchor="middle" font-family="DM Sans,sans-serif">${s.label}</text>`;
      }
      return '';
    }).join('');

    // Y-axis line
    const yAxis = `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${PAD.t + iH}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="${PAD.l}" y1="${PAD.t + iH}" x2="${PAD.l + iW}" y2="${PAD.t + iH}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;

    const weightLine = hasWeights ? makePolyline(sessions.map(s => s.avgW), '#818cf8') : '';
    const repsLine   = hasReps    ? makePolyline(sessions.map(s => s.avgR), '#34d399') : '';

    const legend = [
      hasWeights ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,0.5)"><span style="display:inline-block;width:16px;height:2px;background:#818cf8;border-radius:2px"></span>Avg weight</span>` : '',
      hasReps    ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,0.5)"><span style="display:inline-block;width:16px;height:2px;background:#34d399;border-radius:2px"></span>Avg reps</span>` : '',
    ].filter(Boolean).join('  ');

    chartHTML = `
      <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
        ${yAxis}${weightLine}${repsLine}${xLabels}
      </svg>
      <div style="display:flex;gap:12px;margin-top:6px;justify-content:center">${legend}</div>`;
  }

  // Best session callout
  let bestHTML = '';
  if (sessions.length) {
    const withW = sessions.filter(s => s.avgW !== null);
    const withR = sessions.filter(s => s.avgR !== null);
    const bestW = withW.length ? withW.reduce((a,b) => b.avgW > a.avgW ? b : a) : null;
    const bestR = withR.length ? withR.reduce((a,b) => b.avgR > a.avgR ? b : a) : null;
    const parts = [];
    if (bestW) parts.push(`<span style="color:#818cf8;font-weight:700">${bestW.avgW % 1 === 0 ? bestW.avgW : bestW.avgW.toFixed(1)} lbs</span> (${bestW.label})`);
    if (bestR) parts.push(`<span style="color:#34d399;font-weight:700">${Math.round(bestR.avgR)} reps</span> (${bestR.label})`);
    if (parts.length) {
      bestHTML = `<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:11px;color:rgba(255,255,255,0.5)">
        🏆 Personal best: ${parts.join(' · ')}
      </div>`;
    }
  }

  const content = document.getElementById('chart-modal-content');
  content.innerHTML = `
    <div style="font-size:15px;font-weight:800;color:#fff;margin-bottom:2px">${exName}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:14px">${sessions.length} session${sessions.length !== 1 ? 's' : ''} logged</div>
    ${chartHTML}
    ${bestHTML}
  `;

  const overlay = document.getElementById('chart-modal-overlay');
  const modal   = document.getElementById('chart-modal');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  modal.style.transform = 'scale(1)';
}

function copyLastWeek(k, numSets) {
  const parts = k.split('__');
  const dayName = parts[0];
  const exName = parts.slice(1).join('__');

  const data = getLastSessionData(dayName, exName, numSets);
  if (!data) {
    // Show a toast instead of alert (alert can be blocked on iOS Safari)
    const toast = document.createElement('div');
    toast.textContent = 'No previous session data yet — complete a workout first';
    toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);font-size:13px;padding:10px 18px;border-radius:12px;z-index:9999;white-space:nowrap;font-family:"DM Sans",sans-serif';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
    return;
  }

  // Initialize log if needed
  if (!state.setLogs[k]) {
    state.setLogs[k] = { checked: Array(numSets).fill(false), weights: Array(numSets).fill(''), reps: Array(numSets).fill('') };
  }

  // Copy weights and reps from last session into state
  for (let i = 0; i < numSets; i++) {
    if (data.weights[i]) state.setLogs[k].weights[i] = data.weights[i];
    if (data.reps && data.reps[i]) state.setLogs[k].reps[i] = data.reps[i];
  }

  // Also expand the card so the user can see the filled weights
  state.expanded[k] = true;

  saveSetLogs();
  render();

  // Show confirmation flash after render
  setTimeout(() => {
    const container = document.getElementById('sets-' + k);
    if (container) {
      const card = container.closest('.exercise-card');
      const header = card?.querySelector('.exercise-header');
      if (header) {
        const flash = document.createElement('div');
        flash.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(34,197,94,0.2);border-radius:12px;pointer-events:none;animation:fadeOut 0.8s forwards';
        header.style.position = 'relative';
        header.appendChild(flash);
        setTimeout(() => flash.remove(), 800);
      }
    }
  }, 50);
}

function skipExercise(k) {
  const parts = k.split('__');
  const exName = parts.slice(1).join('__');

  if (!confirm(`Skip "${exName}" today?`)) return;

  // Mark all sets as skipped (checked but no weight)
  const numSets = getExSetsCount(parts[0], exName);
  if (!state.setLogs[k]) {
    state.setLogs[k] = { checked: Array(numSets).fill(false), weights: Array(numSets).fill(''), reps: Array(numSets).fill('') };
  }

  // Mark as checked but leave weights empty (indicates skipped)
  for (let i = 0; i < numSets; i++) {
    state.setLogs[k].checked[i] = true;
    state.setLogs[k].weights[i] = 'skipped';
  }

  saveSetLogs();
  render();
}

function markAllSetsComplete(k, numSets) {
  if (!state.setLogs[k]) {
    state.setLogs[k] = { checked: Array(numSets).fill(false), weights: Array(numSets).fill(''), reps: Array(numSets).fill('') };
  }

  // Mark all as checked
  for (let i = 0; i < numSets; i++) {
    state.setLogs[k].checked[i] = true;

    // Auto-fill current input values
    const weightInput = document.getElementById(`weight-input-${k}-${i}`);
    const repsInput = document.getElementById(`reps-input-${k}-${i}`);

    if (weightInput && weightInput.value) {
      state.setLogs[k].weights[i] = weightInput.value;
    }
    if (repsInput && repsInput.value) {
      state.setLogs[k].reps[i] = repsInput.value;
    }
  }

  saveSetLogs();
  render();
}

function getExSetsCount(dayName, exName) {
  const day = PLAN[dayName];
  const ex = day && day.exercises && day.exercises.find(e => e.name === exName);
  if (!ex) return 1;
  if (ex.progression) {
    const prog = getProgressionPhase(ex.progression);
    const phases = ex.progression === 'pullup' ? PULLUP_PHASES : ex.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
    const phase = phases[prog.phaseIndex];
    // Total flat sets across all phase exercises
    return phase.exercises.reduce((a, pe) => a + (parseInt(pe.sets) || 3), 0);
  }
  return ex.sets;
}

function toggleSet(k, idx, btn) {
  const parts = k.split('__');
  const dayName = parts[0];
  const exName = parts.slice(1).join('__');
  if (!state.setLogs[k]) {
    const sets = getExSetsCount(dayName, exName);
    state.setLogs[k] = { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
  }
  const wasChecked = state.setLogs[k].checked[idx];
  state.setLogs[k].checked[idx] = !wasChecked;
  btn.classList.toggle('checked', state.setLogs[k].checked[idx]);
  btn.textContent = state.setLogs[k].checked[idx] ? '✓' : '';

  saveSetLogs();
  updateExerciseBadge(k);

  // Start rest timer when checking off (not unchecking)
  if (!wasChecked) {
    const day = PLAN[dayName];
    const ex = day && day.exercises && day.exercises.find(e => e.name === exName);

    // Auto-fill target reps if no reps entered
    if (!state.setLogs[k].reps || !state.setLogs[k].reps[idx] || state.setLogs[k].reps[idx] === '') {
      if (ex && ex.reps && !ex.progression) {
        const repStr = (ex.reps || '').toString();
        const repMatch = repStr.match(/(\d+)/);
        if (repMatch) {
          if (!state.setLogs[k].reps) state.setLogs[k].reps = Array(state.setLogs[k].checked.length).fill('');
          state.setLogs[k].reps[idx] = repMatch[1];
          const repInput = document.getElementById('reps-input-' + k + '-' + idx);
          if (repInput) repInput.value = repMatch[1];
          saveSetLogs();
        }
      }
    }
    let restSec = 90;
    if (ex && ex.rest) {
      const m = ex.rest.match(/(\d+)\s*min/);
      const s = ex.rest.match(/(\d+)\s*sec/);
      if (m) restSec = parseInt(m[1]) * 60;
      else if (s) restSec = parseInt(s[1]);
    }
    const color = day ? day.color : '#fff';
    startRestTimer(restSec, color);

    // Save prev weights for next session
    const weights = state.setLogs[k].weights;
    if (weights && weights.some(w => w)) {
      state.prevWeights[k] = [...weights];
      savePrevWeights();
    }

    // Check PR
    const weights2 = state.setLogs[k].weights;
    const isNewPR = checkAndSavePR(k, weights2);
    if (isNewPR) {
      // Flash PR badge on exercise name
      const container = document.getElementById('sets-' + k);
      if (container) {
        const card = container.closest('.exercise-card');
        const nameRow = card && card.querySelector('.exercise-name-row');
        if (nameRow && !nameRow.querySelector('.pr-badge')) {
          const pr = document.createElement('span');
          pr.className = 'pr-badge';
          pr.textContent = '🏆 PR!';
          nameRow.appendChild(pr);
        }
      }
    }
  }
}

function updateWeight(k, idx, val) {
  if (!state.setLogs[k]) {
    const parts = k.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const sets = getExSetsCount(dayName, exName);
    state.setLogs[k] = { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
  }
  state.setLogs[k].weights[idx] = val;
  saveSetLogs();
}

function updateReps(k, idx, val) {
  if (!state.setLogs[k]) {
    const parts = k.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const sets = getExSetsCount(dayName, exName);
    state.setLogs[k] = { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
  }
  if (!state.setLogs[k].reps) state.setLogs[k].reps = Array(getExSetsCount(k.split('__')[0], k.split('__').slice(1).join('__'))).fill('');
  state.setLogs[k].reps[idx] = val;
  saveSetLogs();
}

function adjustReps(k, idx, delta) {
  const input = document.getElementById(`reps-input-${k}-${idx}`);
  if (!input) return;

  const currentVal = parseInt(input.value) || 0;
  const newVal = Math.max(0, currentVal + delta); // Don't go below 0

  input.value = newVal;
  updateReps(k, idx, newVal.toString());
}

function updateExerciseBadge(k) {
  const log = state.setLogs[k];
  if (!log) return;
  const parts = k.split('__');
  const dayName = parts[0];
  const exName = parts.slice(1).join('__');
  const day = PLAN[dayName];
  const ex = day && day.exercises && day.exercises.find(e => e.name === exName);
  if (!ex) return;
  const totalSets = getExSetsCount(dayName, exName);
  const doneSets = log.checked.filter(Boolean).length;
  let allDone;
  if (ex.progression) {
    // Green when ANY single phase exercise has all its sets checked
    const phases = ex.progression === 'pullup' ? PULLUP_PHASES : ex.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
    const phase = phases[getProgressionPhase(ex.progression).phaseIndex];
    const psc = phase.exercises.map(pe => parseInt(pe.sets) || 3);
    allDone = phase.exercises.some((pe, exIdx) => {
      const offset = psc.slice(0, exIdx).reduce((a, b) => a + b, 0);
      const numSets = psc[exIdx];
      return Array.from({length: numSets}, (_, s) => log.checked[offset + s]).every(Boolean);
    });
  } else {
    allDone = doneSets === totalSets;
  }
  const c = ex.progression ? (ex.progression === 'pullup' ? PULLUP_PHASES[getProgressionPhase('pullup').phaseIndex].color : ex.progression === 'pike' ? PIKE_PHASES[getProgressionPhase('pike').phaseIndex].color : PUSHUP_PHASES[getProgressionPhase('pushup').phaseIndex].color) : day.color;

  const container = document.getElementById('sets-' + k);
  if (!container) return;
  const card = container.closest('.exercise-card');
  if (!card) return;

  // Update card border/background
  card.style.background = allDone ? 'rgba(34,197,94,0.06)' : 'rgba(255,255,255,0.05)';
  card.style.border = allDone ? '1px solid rgba(34,197,94,0.25)' : '1px solid rgba(255,255,255,0.08)';

  // Update progress badge
  const nameRow = card.querySelector('.exercise-name-row');
  if (nameRow) {
    let badge = nameRow.querySelector('.ex-badge-done, .ex-badge-progress');
    if (badge) badge.remove();
    if (allDone) {
      const span = document.createElement('span');
      span.className = 'ex-badge-done';
      span.textContent = '✓ done';
      nameRow.appendChild(span);
    } else if (doneSets > 0) {
      const span = document.createElement('span');
      span.className = 'ex-badge-progress';
      span.style.color = c;
      span.style.fontSize = '11px';
      span.textContent = `${doneSets}/${totalSets}`;
      nameRow.appendChild(span);
    }
  }
}

function handleReset(dayName) {
  if (state.resetConfirm !== dayName) {
    state.resetConfirm = dayName;
    render();
    return;
  }
  const day = PLAN[dayName];
  // Before clearing, snapshot current logs into weightHistory so clipboard still works
  const lastKey = getLastCompletedDateForDay(dayName);
  if (lastKey) {
    day.exercises.forEach(ex => {
      const ek = exKey(dayName, ex.name);
      const log = state.setLogs[ek];
      const hasData = log && ((log.weights && log.weights.some(w => w)) || (log.reps && log.reps.some(r => r)) || (log.checked && log.checked.some(c => c)));
      if (hasData) {
        if (!state.weightHistory[ek]) state.weightHistory[ek] = {};
        if (!state.weightHistory[ek][lastKey]) {
          state.weightHistory[ek][lastKey] = { weights: [...(log.weights||[])], reps: [...(log.reps||[])], checked: [...(log.checked||[])] };
        }
      }
    });
    saveWeightHistory();
  }
  day.exercises.forEach(ex => {
    state.setLogs[exKey(dayName, ex.name)] = {
      checked: Array(ex.sets).fill(false),
      weights: Array(ex.sets).fill(''),
    };
  });
  state.resetConfirm = null;
  saveSetLogs();
  render();
}

function buildMuscleSVG(primaryMuscles, secondaryMuscles, view) {
  const zones = view === 'front' ? FRONT_ZONES : BACK_ZONES;

  const normalize = s => s.toLowerCase().replace(/[^a-z]/g,'');
  const isMatch = (zMuscles, targets) =>
    zMuscles.some(zm => targets.some(t => normalize(zm).includes(normalize(t)) || normalize(t).includes(normalize(zm))));

  const zonesSVG = zones.map(z => {
    const isPrimary   = isMatch(z.muscles, primaryMuscles);
    const isSecondary = !isPrimary && secondaryMuscles && isMatch(z.muscles, secondaryMuscles);
    const fill   = isPrimary ? '#FF6B35' : isSecondary ? '#F59E0B' : 'rgba(255,255,255,0.05)';
    const stroke = isPrimary ? '#FF6B35' : isSecondary ? '#F59E0B' : 'rgba(255,255,255,0.12)';
    const opacity = isPrimary ? '0.85' : isSecondary ? '0.5' : '1';
    return `<path d="${z.d}" fill="${fill}" stroke="${stroke}" stroke-width="0.8" opacity="${opacity}" stroke-linejoin="round"/>`;
  }).join('');

  return `<svg viewBox="52 24 96 256" xmlns="http://www.w3.org/2000/svg">
    ${BODY_SILHOUETTE}
    ${zonesSVG}
  </svg>`;
}

function openMuscleModal(exName, musclesStr) {
  const data = EXERCISE_MUSCLES[exName];
  const primary   = data ? data.primary   : musclesStr.split(' · ');
  const secondary = data ? data.secondary : [];

  document.getElementById('muscle-modal-title').textContent = exName.toUpperCase();
  document.getElementById('muscle-modal-sub').textContent = '🎯 Muscle activation map';

  const frontSVG = buildMuscleSVG(primary, secondary, 'front');

  // Count completed exercises
  const completedEx = day.exercises ? day.exercises.filter(ex => {
    const k = exKey(planDay, ex.name);
    const log = state.setLogs[k];
    if (!log) return false;
    if (ex.progression) {
      const phases = ex.progression === 'pullup' ? PULLUP_PHASES : ex.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
      const phase = phases[getProgressionPhase(ex.progression).phaseIndex];
      const psc = phase.exercises.map(pe => parseInt(pe.sets) || 3);
      return phase.exercises.some((pe, exIdx) => {
        const offset = psc.slice(0, exIdx).reduce((a, b) => a + b, 0);

  if (prs && prs.length > 0) {
    const prList = prs.map(pr => `<div style="font-size:12px;color:#F59E0B;margin-top:4px">🏆 ${pr}</div>`).join('');
    stats += `<div class="completion-stat" style="flex-direction:column;align-items:flex-start">
      <span class="completion-stat-label">New PRs!</span>

    </div>`;
  }

  // Exercise summary
  if (day && day.exercises) {
    const exRows = day.exercises.map(ex => {
      const k = exKey(planDay, ex.name);
      const log = state.setLogs[k];

// ── Today's Quick Stats ────────────────────────────────────
// ── Streak Calculator ──────────────────────────────────────
function calculateStreaks() {
  const completedDates = Object.keys(state.completed)
    .map(key => {
      const parts = key.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
    })
    .sort((a, b) => b - a); // Sort desc (newest first)

  if (!completedDates.length) return { current: 0, longest: 0 };

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  // Calculate current streak
  let currentStreak = 0;
  let checkDate = new Date(today);

  // Check if today or yesterday is completed (to allow for flexibility)
  const hasToday = completedDates.some(d => d.getTime() === today.getTime());
  const hasYesterday = completedDates.some(d => d.getTime() === yesterday.getTime());

  if (!hasToday && !hasYesterday) {
    currentStreak = 0;
  } else {
    checkDate = hasToday ? today : yesterday;

    while (true) {
      const hasDate = completedDates.some(d => d.getTime() === checkDate.getTime());
      if (!hasDate) break;
      currentStreak++;
      checkDate.setDate(checkDate.getDate() - 1);
    }
  }

  // Calculate longest streak
  let longestStreak = 0;
  let tempStreak = 0;
  let prevDate = null;

  for (const date of completedDates.reverse()) {
    if (!prevDate) {
      tempStreak = 1;
    } else {
      const dayDiff = Math.floor((date - prevDate) / (1000 * 60 * 60 * 24));
      if (dayDiff === 1) {
        tempStreak++;
      } else {
        longestStreak = Math.max(longestStreak, tempStreak);
        tempStreak = 1;
      }
    }
    prevDate = date;
  }
  longestStreak = Math.max(longestStreak, tempStreak);

  return { current: currentStreak, longest: longestStreak };
}

function buildTodayStats(planDay) {
  const day = PLAN[planDay];
  if (!day || !day.exercises) return '';

  const totalEx = day.exercises.length;
  let completedEx = 0;
  day.exercises.forEach(ex => {
    const k = exKey(planDay, ex.name);
    const log = state.setLogs[k];
    if (!log) return;

    if (ex.progression) {
      // Progression exercise: done if ANY single phase exercise has all its sets complete
      const phases = ex.progression === 'pullup' ? PULLUP_PHASES : ex.progression === 'pike' ? PIKE_PHASES : PUSHUP_PHASES;
      const prog = getProgressionPhase(ex.progression);
      const phase = phases[prog.phaseIndex];
      const psc = phase.exercises.map(pe => parseInt(pe.sets) || 3);
      const isDone = phase.exercises.some((pe, exIdx) => {
        const offset = psc.slice(0, exIdx).reduce((a, b) => a + b, 0);
        const numSets = psc[exIdx];
        return Array.from({length: numSets}, (_, s) => log.checked[offset + s]).every(Boolean);
      });
      if (isDone) completedEx++;
    } else {
      const numSets = ex.sets;
      const doneSets = log.checked.filter(Boolean).length;
      if (doneSets === numSets) completedEx++;
    }
  });

  const volume = computeSessionVolume(planDay);
  const elapsed = getSessionElapsed();

  const fmtDur = (sec) => {

  weekStart.setDate(today.getDate() - dayOfWeek);
  weekStart.setHours(0,0,0,0);

  // Collect this week's completed workouts
  let workoutsThisWeek = 0;
  let volumeThisWeek = 0;
  let volumeLastWeek = 0;
  const workoutDays = [];

  for (const [key, planDay] of Object.entries(state.completed)) {
    if (!planDay) continue;
    const parts = key.split('-');
    const d = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
    d.setHours(0,0,0,0);
    const lastWeekStart = new Date(weekStart);
    lastWeekStart.setDate(weekStart.getDate() - 7);

    if (d >= weekStart && d <= today) {
      workoutsThisWeek++;

        <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:#FF6B35;line-height:1">${volumeThisWeek > 0 ? Math.round(volumeThisWeek) : '—'}</div>

      ${history.length === 0 ? '<div style="color:rgba(255,255,255,0.3);font-size:13px;text-align:center;padding:10px 0">No workouts logged yet</div>' : history.map(h => {
        const c = PLAN[h.planDay]?.color || '#60B8FF';
        const label = PLAN[h.planDay]?.label || h.planDay;
        const dateStr = h.date.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div>
            <div style="font-size:13px;font-weight:600;color:${c}">${label}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px">${dateStr}</div>
          </div>
          ${h.vol > 0 ? `<div style="font-size:13px;font-weight:700;color:#FF6B35">${Math.round(h.vol)} lbs</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    ${buildBodyweightSection()}

    <button onclick="exportData()" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:rgba(255,255,255,0.6);font-size:13px;font-weight:700;padding:14px;cursor:pointer;font-family:'DM Sans',sans-serif">
      💾 Export Workout Data
    </button>
  </div>`;
}

function buildBodyweightSection() {
  const entries = Object.entries(state.bodyweight)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .slice(-12); // last 12 entries

  const todayStr = new Date().toISOString().split('T')[0];
  const todayLogged = state.bodyweight[todayStr];

  // Mini chart
  let chartHTML = '';
  if (entries.length >= 2) {
    const vals = entries.map(e => e[1]);
    const min = Math.min(...vals) - 2;
    const max = Math.max(...vals) + 2;
    const range = max - min || 1;
    const w = 100 / entries.length;
    const points = entries.map(([, v], i) => {
      const x = i * w + w / 2;
      const y = 100 - ((v - min) / range * 80 + 10);
      return `${x},${y}`;
    }).join(' ');
    chartHTML = `
    <div style="margin-bottom:12px">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:60px">
        <polyline points="${points}" fill="none" stroke="#60B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${entries.map(([, v], i) => {
          const x = i * w + w / 2;
          const y = 100 - ((v - min) / range * 80 + 10);
          return `<circle cx="${x}" cy="${y}" r="2.5" fill="#60B8FF"/>`;
        }).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,0.25)">
        <span>${entries[0][0].slice(5)}</span>
        <span>${entries[entries.length-1][0].slice(5)}</span>
      </div>
    </div>`;
  }

  const recentRows = entries.slice(-5).reverse().map(([date, lbs]) => {
    const d = new Date(date + 'T12:00:00');
    const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px">
      <span style="color:rgba(255,255,255,0.4)">${label}</span>
      <span style="color:#fff;font-weight:600">${lbs} lbs</span>
    </div>`;
  }).join('');

  return `
  <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:18px;margin-bottom:16px">
    <div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:14px">⚖️ Body Weight</div>
    ${chartHTML}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="bw-input" type="number" placeholder="lbs (e.g. 130)" step="0.1"
        style="flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none;font-family:'DM Sans',sans-serif"
        value="${todayLogged || ''}" />
      <button onclick="logBodyweight()" style="background:#60B8FF22;border:1px solid #60B8FF55;border-radius:10px;color:#60B8FF;font-size:13px;font-weight:700;padding:10px 16px;cursor:pointer;font-family:'DM Sans',sans-serif">
        Log
      </button>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.25);margin-bottom:${recentRows ? '10px' : '0'}">Log once a week, same day, morning before eating</div>
    ${recentRows}
  </div>`;
}

function logBodyweight() {
  const input = document.getElementById('bw-input');
  const val = parseFloat(input?.value);
  if (!val || val <= 0 || val > 500) return;
  const todayStr = new Date().toISOString().split('T')[0];
  state.bodyweight[todayStr] = val;
  saveBodyweight();
  render();
}

function exportData() {
  const data = {
    completed: state.completed,
    setLogs: state.setLogs,
    volume: state.volume,
    prs: state.prs,
    progPBs: state.progPBs,
    sessionDurations: state.sessionDurations,
    sessionNotes: state.sessionNotes,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workout-data-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Boot ──────────────────────────────────────────────────
loadState();
initSundayGuidedSets();
render();

// ── Guided Stretch Session ─────────────────────────────────
// beepType: 'sides' | 'directions' | 'alternating' | null
// directions: array of label strings shown in sequence (for arm circles, wrist circles, plank/dog)
let guidedStretch = {
  stretches: [],
  index: 0,
  segmentIndex: 0,   // which segment we're on within a stretch
  totalSegments: 1,
  totalSecs: 0,
  endTime: null,
  interval: null,
  paused: false,
  pausedAt: null,
  color: '#60B8FF',
  beepFired: false,
  gettingReady: false,
  readySecs: 5,
};

let _audioCtx = null;
let _silentLoop = null;

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function unlockAudio() {
  try {
    const ctx = getAudioCtx();
    ctx.resume();
    // Play a silent buffer to unlock on iOS Safari
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    // Keep context alive with a silent looping node — prevents iOS from suspending it
    if (!_silentLoop) {
      const silentBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      _silentLoop = ctx.createBufferSource();
      _silentLoop.buffer = silentBuf;
      _silentLoop.loop = true;
      const gain = ctx.createGain();
      gain.gain.value = 0.0001;
      _silentLoop.connect(gain);
      gain.connect(ctx.destination);
      _silentLoop.start(0);
    }
  } catch(e) {}
}

function stopAudioKeepAlive() {
  try {
    if (_silentLoop) { _silentLoop.stop(); _silentLoop = null; }
  } catch(e) { _silentLoop = null; }
}

function playBeep(type) {
  try {
    const ctx = getAudioCtx();
    const doPlay = () => {
      const beeps = type === 'switch' ? [[880, 0, 0.15], [880, 0.22, 0.15]]
                  : type === 'done'   ? [[520, 0, 0.15], [520, 0.2, 0.15]]
                  : type === 'start'  ? [[880, 0, 0.18]]
                  :                    [[660, 0, 0.3]];
      beeps.forEach(([freq, start, dur]) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        o.type = 'sine';
        g.gain.setValueAtTime(0.7, ctx.currentTime + start);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        o.start(ctx.currentTime + start);
        o.stop(ctx.currentTime + start + dur + 0.05);
      });
    };
    if (ctx.state === 'suspended') {
      ctx.resume().then(doPlay);
    } else {
      doPlay();
    }
  } catch(e) {}
}

function startGuidedStretch(stretches, color) {
  // Unlock audio on user gesture — required for iOS Safari
  unlockAudio();
  guidedStretch.stretches = stretches;
  guidedStretch.index = 0;
  guidedStretch.color = color || '#60B8FF';
  const overlay = document.getElementById('guided-stretch-overlay');
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  loadGuidedStep();
}

function loadGuidedStep() {
  const gs = guidedStretch;
  if (gs.index >= gs.stretches.length) {
    showGuidedDone();
    return;
  }
  const stretch = gs.stretches[gs.index];
  gs.segmentIndex = 0;
  gs.totalSegments = stretch.segments ? stretch.segments.length : 1;
  // For multi-segment stretches, divide total time evenly
  gs.totalSecs = stretch.segments ? Math.floor(stretch.secs / gs.totalSegments) : stretch.secs;
  gs.beepFired = false;
  gs.gettingReady = true;
  gs.readySecs = 5;
  renderGuidedReady();
  if (gs.interval) clearInterval(gs.interval);
  gs.interval = setInterval(() => {
    gs.readySecs--;
    if (gs.readySecs <= 0) {
      clearInterval(gs.interval);
      gs.interval = null;
      gs.gettingReady = false;
      playBeep('start');
      startGuidedTimer();
      renderGuidedStep();
    } else {
      renderGuidedReady();
    }
  }, 1000);
}

function renderGuidedReady() {
  const gs = guidedStretch;
  const overlay = document.getElementById('guided-stretch-overlay');
  if (!overlay) return;
  const stretch = gs.stretches[gs.index];
  const total = gs.stretches.length;
  const c = gs.color;
  overlay.innerHTML = `
    <div style="width:100%;max-width:360px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <button onclick="closeGuidedStretch()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:22px;cursor:pointer;padding:4px">✕</button>
        <span style="font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase">${gs.index + 1} of ${total}</span>
        <div style="width:30px"></div>
      </div>
      <div class="gs-progress-bar-track">
        <div class="gs-progress-bar-fill" style="width:${(gs.index/total*100).toFixed(1)}%;background:${c}"></div>
      </div>
      <div style="height:32px"></div>
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:12px">Get into position</div>
      <div class="gs-name">${stretch.name}</div>
      <div class="gs-cue">${stretch.cue}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:96px;color:${c};text-align:center;line-height:1">${gs.readySecs}</div>
      <div style="text-align:center;margin-top:8px">
        <button class="gs-btn gs-btn-secondary" onclick="guidedSkipReady()">Skip countdown</button>
      </div>
    </div>`;
}

function guidedSkipReady() {
  const gs = guidedStretch;
  if (gs.interval) clearInterval(gs.interval);
  gs.gettingReady = false;
  playBeep('start');
  startGuidedTimer();
  renderGuidedStep();
}

function startGuidedTimer() {
  const gs = guidedStretch;
  if (gs.interval) clearInterval(gs.interval);
  gs.paused = false;
  gs.pausedAt = null;
  gs.endTime = Date.now() + gs.totalSecs * 1000;
  gs.interval = setInterval(tickGuidedTimer, 200);
}

function tickGuidedTimer() {
  const gs = guidedStretch;
  if (gs.paused) return;
  const remaining = Math.max(Math.round((gs.endTime - Date.now()) / 1000), 0);
  updateGuidedRing(remaining, gs.totalSecs);
  if (remaining <= 0) {
    clearInterval(gs.interval);
    gs.interval = null;
    // Move to next segment if there are more
    if (gs.segmentIndex < gs.totalSegments - 1) {
      playBeep('switch');
      if (navigator.vibrate) navigator.vibrate([80]);
      gs.segmentIndex++;
      // 3-second pause before restarting — show countdown in the ring
      let switchCountdown = 3;
      renderGuidedStep();
      const num = document.getElementById('gs-ring-num');
      if (num) num.textContent = switchCountdown;
      const switchInterval = setInterval(() => {
        switchCountdown--;
        const n = document.getElementById('gs-ring-num');
        if (n) n.textContent = switchCountdown > 0 ? switchCountdown : 'GO';
        if (switchCountdown <= 0) {
          clearInterval(switchInterval);
          playBeep('start');
          gs.endTime = Date.now() + gs.totalSecs * 1000;
          gs.interval = setInterval(tickGuidedTimer, 200);
        }
      }, 1000);
    } else {
      playBeep('done');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      // If jump rope (index 0), show a continue button instead of auto-advancing
      const stretch = gs.stretches[gs.index];
      if (stretch.name === 'Jump Rope') {
        showGuidedContinue();
      } else {
        setTimeout(() => { guidedNextStep(); }, 800);
      }
    }
  }
}

function pauseGuidedTimer() {
  const gs = guidedStretch;
  const btn = document.getElementById('gs-pause-btn');
  if (gs.paused) {
    gs.endTime += Date.now() - gs.pausedAt;
    gs.paused = false;
    gs.pausedAt = null;
    if (btn) btn.textContent = '⏸ Pause';
  } else {
    gs.pausedAt = Date.now();
    gs.paused = true;
    if (btn) btn.textContent = '▶ Resume';
  }
}

function guidedNextStep() {
  const gs = guidedStretch;
  if (gs.interval) clearInterval(gs.interval);
  gs.index++;
  gs.segmentIndex = 0;
  loadGuidedStep();
}

function guidedPrevStep() {
  const gs = guidedStretch;
  if (gs.interval) clearInterval(gs.interval);
  if (gs.index > 0) gs.index--;
  loadGuidedStep();
}

function closeGuidedStretch() {
  const gs = guidedStretch;
  if (gs.interval) clearInterval(gs.interval);
  stopAudioKeepAlive();
  const overlay = document.getElementById('guided-stretch-overlay');
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}

function updateGuidedRing(remaining, total) {
  const circle = document.getElementById('gs-ring-circle');
  const num = document.getElementById('gs-ring-num');
  if (!circle || !num) return;
  const r = 70;
  const circ = 2 * Math.PI * r;
  const pct = total > 0 ? remaining / total : 0;
  circle.style.strokeDashoffset = circ * (1 - pct);
  num.textContent = remaining;
}

function renderGuidedStep() {
  const gs = guidedStretch;
  const overlay = document.getElementById('guided-stretch-overlay');
  if (!overlay) return;
  const stretch = gs.stretches[gs.index];
  const total = gs.stretches.length;
  const r = 70;
  const circ = 2 * Math.PI * r;
  const c = gs.color;
  const segLabel = stretch.segments ? stretch.segments[gs.segmentIndex] : null;
  const nextSeg = stretch.segments && gs.segmentIndex < gs.totalSegments - 1 ? stretch.segments[gs.segmentIndex + 1] : null;

  overlay.innerHTML = `
    <div style="width:100%;max-width:360px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <button onclick="closeGuidedStretch()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:22px;cursor:pointer;padding:4px">✕</button>
        <span style="font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase">${gs.index + 1} of ${total}</span>
        <div style="width:30px"></div>
      </div>
      <div class="gs-progress-bar-track">
        <div class="gs-progress-bar-fill" style="width:${((gs.index)/total*100).toFixed(1)}%;background:${c}"></div>
      </div>
      <div style="height:20px"></div>
      <div class="gs-name">${stretch.name}</div>
      ${segLabel ? `<div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:${c};text-align:center;margin-bottom:4px;letter-spacing:1px">${segLabel}</div>` : ''}
      ${nextSeg ? `<div style="font-size:11px;color:rgba(255,255,255,0.3);text-align:center;margin-bottom:8px">Next: ${nextSeg}</div>` : '<div style="height:12px"></div>'}
      <div class="gs-cue">${stretch.cue}</div>
      <div class="gs-ring" style="margin:0 auto 8px">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
          <circle id="gs-ring-circle" cx="80" cy="80" r="${r}" fill="none" stroke="${c}" stroke-width="10"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ * 0}"
            stroke-linecap="round" style="transition:stroke-dashoffset 0.9s linear"/>
        </svg>
        <div id="gs-ring-num" class="gs-ring-num">${gs.totalSecs}</div>
      </div>
      <div class="gs-btn-row" style="justify-content:center">
        <button id="gs-pause-btn" class="gs-btn gs-btn-secondary" onclick="pauseGuidedTimer()">⏸ Pause</button>
        <button class="gs-btn gs-btn-primary" onclick="guidedNextStep()">Skip →</button>
      </div>
      ${gs.index > 0 ? `<div style="text-align:center"><button class="gs-btn gs-btn-skip" onclick="guidedPrevStep()">← Back</button></div>` : ''}
    </div>`;
  const circle = document.getElementById('gs-ring-circle');
  if (circle) circle.style.strokeDashoffset = 0;
}

function showGuidedContinue() {
  const overlay = document.getElementById('guided-stretch-overlay');
  if (!overlay) return;
  const c = guidedStretch.color;
  const gs = guidedStretch;
  const total = gs.stretches.length;
  overlay.innerHTML = `
    <div style="width:100%;max-width:360px;text-align:center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <button onclick="closeGuidedStretch()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:22px;cursor:pointer;padding:4px">✕</button>
        <span style="font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase">${gs.index + 1} of ${total}</span>
        <div style="width:30px"></div>
      </div>
      <div class="gs-progress-bar-track" style="margin-bottom:32px">
        <div class="gs-progress-bar-fill" style="width:${((gs.index + 1)/total*100).toFixed(1)}%;background:${c}"></div>
      </div>
      <div style="font-size:48px;margin-bottom:16px">✅</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;color:${c};margin-bottom:8px">Jump Rope Done!</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.45);margin-bottom:32px">Catch your breath, then continue to stretching.</div>
      <button class="gs-btn gs-btn-primary" style="font-size:16px;padding:14px 40px" onclick="guidedNextStep()">Continue to Stretches →</button>
    </div>`;
}

function showGuidedDone() {
  const overlay = document.getElementById('guided-stretch-overlay');
  if (!overlay) return;
  const c = guidedStretch.color;
  overlay.innerHTML = `
    <div class="gs-done-screen">
      <div class="gs-done-icon">🎉</div>
      <div class="gs-done-title">Warm-Up Done!</div>
      <div class="gs-done-sub">You're ready to train. Let's go.</div>
      <button class="gs-btn gs-btn-primary" style="font-size:16px;padding:14px 40px" onclick="closeGuidedStretch()">Start Workout →</button>
    </div>`;
  if (navigator.vibrate) navigator.vibrate([100, 80, 200]);
  document.body.style.overflow = '';
}
</script>
<div id="guided-stretch-overlay" class="hidden"></div>
</body>
</html>
