<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workout" />
<title>Workout Tracker</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Workout Tracker&quot;,&quot;short_name&quot;:&quot;Workout&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230d0d12&quot;,&quot;theme_color&quot;:&quot;%230d0d12&quot;,&quot;start_url&quot;:&quot;.&quot;}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0d0d12; color: #fff; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  input, textarea, button { font-family: 'DM Sans', sans-serif; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
  a { text-decoration: none; color: inherit; }

  #app { min-height: 100vh; padding-bottom: 80px; }

  /* Header */
  .header { padding: 30px 22px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .header-eyebrow { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; line-height: 1; color: #fff; }
  .header-sub { margin-top: 5px; font-size: 12px; color: rgba(255,255,255,0.35); }
  .save-badge { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 20px; padding: 3px 10px; }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .save-label { font-size: 10px; color: #22c55e; }
  .today-banner { margin-top: 12px; display: inline-flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 16px; cursor: pointer; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .tab-btn { flex: 1; padding: 13px 0; border: none; cursor: pointer; background: transparent; color: rgba(255,255,255,0.3); font-weight: 400; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: #fff; font-weight: 700; border-bottom-color: #fff; }

  /* Day pills */
  .day-pills { display: flex; overflow-x: auto; gap: 8px; padding: 16px 0 16px; scrollbar-width: none; }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill { flex-shrink: 0; padding: 8px 16px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.45); font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .day-pill.active { border: none; color: #fff; font-weight: 700; }

  /* Content */
  .content { padding: 18px 20px 0; }

  /* Day header */
  .day-header { border-radius: 20px; padding: 18px 16px; margin-bottom: 14px; }
  .day-header-inner { display: flex; align-items: center; gap: 12px; }
  .day-emoji { font-size: 30px; }
  .day-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; }
  .day-focus { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .day-badges { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
  .badge-time { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600; }

  /* Buttons */
  .complete-btn { margin-top: 14px; width: 100%; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .complete-btn.done { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #22c55e; }
  .reset-btn { margin-top: 8px; width: 100%; padding: 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.3); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .reset-btn.confirm { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: #ef4444; }

  /* Video card */
  .video-card { display: flex; align-items: center; gap: 14px; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .video-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .video-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .video-title { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.3; }
  .video-meta { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 3px; }
  .video-arrow { color: rgba(255,255,255,0.2); font-size: 16px; flex-shrink: 0; margin-left: auto; }

  /* Exercise card */
  .exercise-card { border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; transition: all 0.2s; }
  .exercise-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .exercise-name-row { display: flex; align-items: center; gap: 7px; }
  .exercise-name { color: #fff; font-weight: 600; font-size: 14px; }
  .ex-badge-done { font-size: 11px; color: #22c55e; }
  .ex-badge-progress { font-size: 11px; }
  .exercise-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .tag-muted { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.4); font-weight: 400; }
  .chevron { color: rgba(255,255,255,0.3); font-size: 14px; margin-left: 8px; }

  /* Set logger */
  .sets-container { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .set-row { display: flex; align-items: center; gap: 10px; }
  .set-check { width: 26px; height: 26px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 13px; font-weight: 700; color: #fff; }
  .set-check.checked { background: #22c55e; border-color: #22c55e; }
  .set-label { color: rgba(255,255,255,0.4); font-size: 12px; width: 42px; flex-shrink: 0; }
  .set-input { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 12px; padding: 4px 8px; width: 100%; outline: none; }
  .set-input-group { display: flex; gap: 6px; flex: 1; align-items: center; }
  .set-input-small { width: 60px; flex-shrink: 0; }
  .set-input-label { font-size: 10px; color: rgba(255,255,255,0.3); margin-bottom: 2px; }
  .reps-controls { display: flex; flex-direction: column; gap: 2px; margin-left: -4px; }
  .reps-arrow { width: 24px; height: 18px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; color: rgba(255,255,255,0.6); font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .reps-arrow:active { background: rgba(255,255,255,0.15); }
  .weight-quick-select { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .weight-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 600; padding: 4px 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .weight-btn:hover { background: rgba(255,255,255,0.15); }
  .weight-btn.active { background: #FF6B35; border-color: #FF6B35; color: #fff; }
  .weight-override-btn { width: 20px; height: 20px; border-radius: 4px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; margin-left: 4px; }
  .weight-override-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
  .set-weight-picker { display: none; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .set-weight-picker.open { display: flex; }
  .set-weight-picker .weight-btn { font-size: 10px; padding: 3px 6px; }

  /* Notes */
  .notes-label { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 8px; margin-top: 16px; }
  .notes-area { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 13px; padding: 12px 14px; outline: none; resize: none; }

  /* Tips */
  .tips-card { margin-top: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 14px 16px; }
  .tips-title { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 10px; }
  .tips-text { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.9; }
  .tips-text b { color: #fff; font-weight: 600; }

  /* Calendar */
  .calendar-wrap { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 18px 16px; margin-bottom: 20px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-nav-btn { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 22px; cursor: pointer; padding: 4px 10px; line-height: 1; }
  .cal-month { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day-label { text-align: center; font-size: 9px; color: rgba(255,255,255,0.22); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 0 6px; }
  .cal-cell { aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 1px solid transparent; cursor: pointer; }
  .cal-num { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.6); }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 2px; }
  .cal-check { font-size: 7px; position: absolute; top: 2px; right: 3px; }
  .cal-legend { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
  .legend-label { font-size: 10px; color: rgba(255,255,255,0.35); }

  /* Streak */
  .streak-row { display: flex; gap: 10px; margin-top: 14px; }
  .streak-box { flex: 1; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px; text-align: center; }
  .streak-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; }
  .streak-lbl { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }

  /* Sunday */
  .stretch-section { margin-bottom: 20px; }
  .stretch-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stretch-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .stretch-section-dur { font-size: 11px; color: rgba(255,255,255,0.3); }
  .stretch-move { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .stretch-name { color: #fff; font-weight: 500; font-size: 14px; }
  .stretch-hold { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; flex-shrink: 0; margin-left: 10px; }

  /* Rest timer */
  #rest-timer-overlay { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 999; background: #1a1a24; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 14px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); min-width: 240px; }
  #rest-timer-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
  #rest-timer-count { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; }
  #rest-timer-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 4px; }
  #rest-timer-bar-fill { height: 3px; border-radius: 2px; transition: width 1s linear; }
  #rest-timer-skip { background: rgba(255,255,255,0.08); border: none; border-radius: 10px; color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600; padding: 6px 12px; cursor: pointer; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }

  /* Session timer */
  #session-timer { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px; margin-top: 8px; }
  #session-timer-dot { width: 6px; height: 6px; border-radius: 50%; }
  #session-timer-val { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* PR badge */
  .pr-badge { display: inline-flex; align-items: center; gap: 3px; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.35); border-radius: 8px; padding: 2px 7px; font-size: 10px; font-weight: 700; color: #F59E0B; margin-left: 6px; }

  /* Stretch timer btn */
  .stretch-timer-btn { background: rgba(96,184,255,0.12); border: 1px solid rgba(96,184,255,0.25); border-radius: 10px; color: #60B8FF; font-size: 11px; font-weight: 600; padding: 5px 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; flex-shrink: 0; transition: all 0.2s; }
  .stretch-timer-btn.running { background: rgba(96,184,255,0.25); }
  .stretch-timer-btn.done { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.4); color: #22c55e; }

  /* Guided stretch overlay */
  #guided-stretch-overlay { position: fixed; inset: 0; z-index: 2000; background: #0d0d14; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  #guided-stretch-overlay.hidden { display: none; }
  .gs-progress-bar-track { width: 100%; max-width: 360px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 8px; }
  .gs-progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s linear; }
  .gs-step { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 28px; }
  .gs-name { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff; text-align: center; margin-bottom: 10px; line-height: 1.1; }
  .gs-cue { font-size: 13px; color: rgba(255,255,255,0.55); text-align: center; max-width: 320px; line-height: 1.6; margin-bottom: 32px; }
  .gs-ring { position: relative; width: 160px; height: 160px; margin-bottom: 32px; }
  .gs-ring svg { transform: rotate(-90deg); }
  .gs-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: #fff; }
  .gs-side-label { font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; margin-top: -24px; margin-bottom: 32px; }
  .gs-btn-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .gs-btn { padding: 12px 28px; border-radius: 14px; font-size: 14px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; transition: all 0.2s; }
  .gs-btn-primary { background: #fff; color: #0d0d14; }
  .gs-btn-secondary { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.12); }
  .gs-btn-skip { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; padding: 9px 20px; }
  .gs-done-screen { text-align: center; }
  .gs-done-icon { font-size: 64px; margin-bottom: 16px; }
  .gs-done-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: #22c55e; margin-bottom: 8px; }
  .gs-done-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 32px; }

  /* Heatmap */
  .heatmap-body { position: relative; width: 160px; height: 280px; margin: 0 auto; }
  .heatmap-zone { position: absolute; border-radius: 6px; cursor: default; transition: opacity 0.3s; }
  .prev-weight-hint { font-size: 10px; color: rgba(255,255,255,0.28); font-style: italic; margin-left: 4px; }

  /* Muscle Modal */
  #muscle-modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #muscle-modal-overlay.open { opacity: 1; pointer-events: all; }
  #muscle-modal {
    width: 100%; max-width: 480px;
    background: #14141e; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px 24px 0 0; padding: 0 0 32px;
    transform: translateY(40px); transition: transform 0.3s cubic-bezier(.22,1,.36,1);
    max-height: 90vh; overflow-y: auto; position: relative;
  }
  #muscle-modal-overlay.open #muscle-modal { transform: translateY(0); }
  .muscle-modal-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); margin: 12px auto 0; }
  .muscle-modal-header { padding: 16px 20px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .muscle-modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; }
  .muscle-modal-sub { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }
  .muscle-modal-close { position: absolute; top: 14px; right: 18px; background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.5); width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
  .muscle-figure-wrap { display: flex; gap: 12px; justify-content: center; padding: 20px 16px 10px; }
  .muscle-figure-wrap svg { width: 120px; height: auto; }
  .muscle-group-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin: 3px; }
  .muscle-primary-chip { background: rgba(255,107,53,0.2); border: 1px solid rgba(255,107,53,0.5); color: #FF6B35; }
  .muscle-secondary-chip { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.45); }
  .muscle-section-label { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin: 12px 0 6px; }
  .tag-target { cursor: pointer; transition: opacity 0.15s; }
  .tag-target:hover { opacity: 0.75; }

  /* Completion Summary Modal */
  #completion-modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #completion-modal-overlay.open { opacity: 1; pointer-events: all; }
  #completion-modal { width: 90%; max-width: 380px; background: #14141e; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 24px; transform: scale(0.9); transition: transform 0.3s cubic-bezier(.22,1,.36,1); }
  #completion-modal-overlay.open #completion-modal { transform: scale(1); }
  .completion-emoji { font-size: 48px; text-align: center; margin-bottom: 12px; }
  .completion-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; text-align: center; margin-bottom: 8px; }
  .completion-subtitle { font-size: 13px; color: rgba(255,255,255,0.4); text-align: center; margin-bottom: 20px; }
  .completion-stat { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 8px; }
  .completion-stat-label { font-size: 13px; color: rgba(255,255,255,0.5); }
  .completion-stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
  .completion-close-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, #FF6B35, #F59E0B); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .completion-close-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }

function getProgressionPhase(type) {
  const PULLUP_DAYS = new Set(['Wednesday', 'Friday']);
  const PUSHUP_DAYS = new Set(['Monday', 'Friday']);
  const days = type === 'pullup' ? PULLUP_DAYS : PUSHUP_DAYS;
  const sessionsPerPhase = type === 'pullup' ? 6 : 4;

  const start = new Date(PROGRESSION_START);
  start.setHours(0, 0, 0, 0);

  let sessionCount = 0;
  for (const [key, planDay] of Object.entries(state.completed)) {
    if (!planDay) continue;
    const parts = key.split('-');
    const d = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
    d.setHours(0, 0, 0, 0);
    if (d >= start && days.has(planDay)) sessionCount++;
  }

  let phaseIndex = Math.min(Math.floor(sessionCount / sessionsPerPhase), 4);

  // Manual phase override — allows advancing phase regardless of session count
  try {
    const overrideKey = type === 'pullup' ? 'natalia-pullup-phase-override' : 'natalia-pushup-phase-override';
    const override = localStorage.getItem(overrideKey);
    if (override !== null) phaseIndex = Math.max(phaseIndex, Math.min(parseInt(override), 4));
  } catch(e) {}

  const sessionsIntoPhase = sessionCount - phaseIndex * sessionsPerPhase;
  const sessionsUntilNext = phaseIndex < 4 ? Math.max(sessionsPerPhase - sessionsIntoPhase, 0) : 0;

  return { sessionCount, phaseIndex, sessionsIntoPhase: Math.max(sessionsIntoPhase, 0), sessionsUntilNext, sessionsPerPhase };
}

// ── Rest Timer ────────────────────────────────────────────
let restTimer = { active: false, total: 0, remaining: 0, color: '#fff', interval: null, endTime: null, paused: false, pausedAt: null };

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function playTimerBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three short beeps
    [0, 0.25, 0.5].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.6, ctx.currentTime + offset);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.2);
      osc.start(ctx.currentTime + offset);
      osc.stop(ctx.currentTime + offset + 0.2);
    });
  } catch(e) {}
}

function fireTimerDoneAlert() {
  playTimerBeep();
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Rest done! 💪', { body: 'Time for your next set.' });
  }
  // Show loud in-app banner — works even on iOS when returning to app
  showTimerDoneBanner();
}

function showTimerDoneBanner() {
  let banner = document.getElementById('timer-done-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'timer-done-banner';
    document.body.appendChild(banner);
  }
  banner.style.cssText = `
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;
    background:linear-gradient(135deg,#22c55e,#10b981);
    color:#fff;font-family:'DM Sans',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:timerFlash 0.6s ease;
  `;
  banner.innerHTML = `
    <div style="font-size:80px;margin-bottom:16px;animation:pulse 1s infinite">💪</div>
    <div style="font-size:32px;font-weight:900;letter-spacing:1px;margin-bottom:8px">REST DONE!</div>
    <div style="font-size:18px;opacity:0.85;margin-bottom:40px">Time for your next set</div>
    <button onclick="document.getElementById('timer-done-banner').remove()" style="background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.5);border-radius:16px;color:#fff;font-size:20px;font-weight:900;padding:16px 48px;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:1px">
      LET'S GO
    </button>
  `;
  // No auto-dismiss — stays until tapped
}

// When user returns to the app, check if timer finished while away
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && restTimer.active && !restTimer.paused) {
    const remaining = Math.round((restTimer.endTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(restTimer.interval);
      restTimer.active = false;
      restTimer.remaining = 0;
      fireTimerDoneAlert();
      const el = document.getElementById('rest-timer-overlay');
      if (el) el.remove();
    }
  }
});

function startRestTimer(seconds, color) {
  if (restTimer.interval) clearInterval(restTimer.interval);
  const endTime = Date.now() + seconds * 1000;
  restTimer = { active: true, total: seconds, remaining: seconds, color: color || '#fff', interval: null, endTime, paused: false, pausedAt: null };
  showRestTimer();
  restTimer.interval = setInterval(() => {
    if (restTimer.paused) return;
    const remaining = Math.max(Math.round((restTimer.endTime - Date.now()) / 1000), 0);
    restTimer.remaining = remaining;
    updateRestTimerUI();
    if (remaining <= 0) {
      clearInterval(restTimer.interval);
      restTimer.active = false;
      fireTimerDoneAlert();
      setTimeout(() => {
        const el = document.getElementById('rest-timer-overlay');
        if (el) el.remove();
      }, 800);
    }
  }, 500);
}

function pauseRestTimer() {
  if (!restTimer.active) return;
  if (restTimer.paused) {
    // Resume: shift endTime forward by however long we were paused
    restTimer.endTime += Date.now() - restTimer.pausedAt;
    restTimer.paused = false;
    restTimer.pausedAt = null;
  } else {
    // Pause: freeze remaining and record when we paused
    restTimer.remaining = Math.max(Math.round((restTimer.endTime - Date.now()) / 1000), 0);
    restTimer.pausedAt = Date.now();
    restTimer.paused = true;
  }
  updateRestTimerUI();
}

function restartRestTimer() {
  if (!restTimer.active && !restTimer.paused) return;
  restTimer.paused = false;
  restTimer.endTime = Date.now() + restTimer.total * 1000;
  restTimer.remaining = restTimer.total;
  updateRestTimerUI();
}

    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">

      <button onclick="addRestTime(30)" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.6);font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">+30s</button>
      <button id="rest-timer-pause" onclick="pauseRestTimer()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.6);font-size:13px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">⏸</button>
      <button onclick="restartRestTimer()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.6);font-size:13px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">↺</button>
    </div>
    <button id="rest-timer-skip" onclick="skipRestTimer()">Skip ✕</button>`;
}

function updateRestTimerUI() {
  const count = document.getElementById('rest-timer-count');
  const fill = document.getElementById('rest-timer-bar-fill');
  const pauseBtn = document.getElementById('rest-timer-pause');
  const remaining = restTimer.remaining;
  if (count) {
    count.textContent = remaining + 's';
    count.style.color = restTimer.paused ? 'rgba(255,255,255,0.4)' : (remaining <= 5 ? '#ef4444' : restTimer.color);
  }
  if (fill) fill.style.width = (remaining / restTimer.total * 100) + '%';
  if (pauseBtn) pauseBtn.textContent = restTimer.paused ? '▶' : '⏸';
}

function skipRestTimer() {
  if (restTimer.interval) clearInterval(restTimer.interval);
  restTimer.active = false;
  const el = document.getElementById('rest-timer-overlay');
  if (el) el.remove();
}

function addRestTime(sec) {
  restTimer.endTime += sec * 1000;
  restTimer.total += sec;
  restTimer.remaining = Math.max(Math.round((restTimer.endTime - Date.now()) / 1000), 0);
  if (restTimer.remaining <= 0) {
    skipRestTimer();
    return;
  }
  updateRestTimerUI();
}

// ── Session Timer (pauseable) ─────────────────────────────
let sessionTimerInterval = null;

function getSessionElapsed() {
  if (!state.sessionStart && !state.sessionElapsedBeforePause) return 0;
  if (state.sessionPaused) return Math.floor(state.sessionElapsedBeforePause / 1000);
  return Math.floor((state.sessionElapsedBeforePause + (Date.now() - (state.sessionStart || Date.now()))) / 1000);
}

function startSessionTimer() {
  if (!state.sessionStart) {
    state.sessionStart = Date.now();
    state.sessionElapsedBeforePause = 0;
    state.sessionPaused = false;
    saveSessionState();
  }
  if (sessionTimerInterval) clearInterval(sessionTimerInterval);
  if (!state.sessionPaused) {
    sessionTimerInterval = setInterval(updateSessionTimerUI, 1000);
  }
}

function pauseSessionTimer() {
  if (state.sessionPaused) {
    // Resume
    state.sessionStart = Date.now();
    state.sessionPaused = false;
    saveSessionState();
    sessionTimerInterval = setInterval(updateSessionTimerUI, 1000);
  } else {
    // Pause — accumulate elapsed so far, then freeze
    state.sessionElapsedBeforePause += Date.now() - (state.sessionStart || Date.now());
    state.sessionStart = Date.now(); // keep a valid value so getSessionElapsed doesn't break
    state.sessionPaused = true;
    saveSessionState();
    if (sessionTimerInterval) clearInterval(sessionTimerInterval);
  }
  updateSessionTimerUI();
  const btn = document.getElementById('session-pause-btn');
  if (btn) btn.textContent = state.sessionPaused ? '▶' : '⏸';
  const dot = document.getElementById('session-timer-dot');
  if (dot) {
    dot.style.background = state.sessionPaused ? '#F59E0B' : '#22c55e';
    dot.style.animation = state.sessionPaused ? 'none' : 'pulse 1.5s infinite';
  }
  const label = document.getElementById('session-timer-label');
  if (label) label.textContent = state.sessionPaused ? 'Paused' : 'Session';
}

function updateSessionTimerUI() {
  const el = document.getElementById('session-timer-val');
  if (!el) return;
  const elapsed = getSessionElapsed();
  const m = Math.floor(elapsed / 60).toString().padStart(2,'0');
  const s = (elapsed % 60).toString().padStart(2,'0');
  el.textContent = m + ':' + s;
}

function getSessionTimerDisplay() {
  const elapsed = getSessionElapsed();
  if (!elapsed && !state.sessionStart && !state.sessionPaused) return '';
  const m = Math.floor(elapsed / 60).toString().padStart(2,'0');
  const s = (elapsed % 60).toString().padStart(2,'0');
  return m + ':' + s;
}

function resetSessionTimer() {
  state.sessionStart = Date.now();
  state.sessionElapsedBeforePause = 0;
  state.sessionPaused = false;
  saveSessionState();
  if (sessionTimerInterval) clearInterval(sessionTimerInterval);
  sessionTimerInterval = setInterval(updateSessionTimerUI, 1000);
  updateSessionTimerUI();
  const btn = document.getElementById('session-pause-btn');
  if (btn) btn.textContent = '⏸';
}

// ── Volume Tracking ───────────────────────────────────────
function computeSessionVolume(dayName) {
  const day = PLAN[dayName];
  if (!day || !day.exercises) return 0;
  let total = 0;
  day.exercises.forEach(ex => {
    if (ex.progression) return;
    const k = exKey(dayName, ex.name);
    const log = state.setLogs[k];
    if (!log) return;
    log.weights.forEach((w, i) => {
      const lbs = parseFloat(w);
      // Use actual reps logged, or fall back to target reps
      const actualReps = log.reps && log.reps[i] ? parseInt(log.reps[i]) : null;
      const targetReps = parseInt((ex.reps || '').toString().split('–')[0]) || 1;
      const repsToUse = actualReps || targetReps;

      if (!isNaN(lbs) && lbs > 0 && log.checked[i] && repsToUse > 0) {
        total += lbs * repsToUse;
      }
    });
  });
  return Math.round(total);
}

// ── Stretch Timers ────────────────────────────────────────
let stretchTimers = {}; // { id: { total, endTime, interval, done } }

function startStretchTimer(id, seconds) {
  if (stretchTimers[id] && stretchTimers[id].interval) {
    clearInterval(stretchTimers[id].interval);
  }
  if (stretchTimers[id] && stretchTimers[id].done) {
    stretchTimers[id] = null;
    updateStretchTimerBtn(id, seconds, false, false);
    return;
  }
  const endTime = Date.now() + seconds * 1000;
  stretchTimers[id] = { total: seconds, endTime, interval: null, done: false };
  updateStretchTimerBtn(id, seconds, true, false);
  stretchTimers[id].interval = setInterval(() => {
    const remaining = Math.max(Math.round((stretchTimers[id].endTime - Date.now()) / 1000), 0);
    if (remaining <= 0) {
      clearInterval(stretchTimers[id].interval);
      stretchTimers[id].done = true;
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      updateStretchTimerBtn(id, 0, false, true);
    } else {
      updateStretchTimerBtn(id, remaining, true, false);
    }
  }, 500);
}

function updateStretchTimerBtn(id, val, running, done) {
  const btn = document.getElementById('stimer-' + id);
  if (!btn) return;
  btn.className = 'stretch-timer-btn' + (running ? ' running' : '') + (done ? ' done' : '');
  if (done) btn.textContent = '✓ Done — tap reset';
  else if (running) btn.textContent = val + 's';
  else btn.textContent = '▶ Start';
}

// ── PR Tracker ────────────────────────────────────────────
function checkAndSavePR(k, weights) {
  const nums = weights.map(w => parseFloat(w)).filter(n => !isNaN(n) && n > 0);
  if (!nums.length) return false;
  const maxThisSession = Math.max(...nums);
  const existing = state.prs[k];
  if (!existing || maxThisSession > existing.weight) {
    state.prs[k] = { weight: maxThisSession, date: new Date().toLocaleDateString() };
    try { localStorage.setItem(PR_KEY, JSON.stringify(state.prs)); } catch(e) {}
    return true; // new PR!
  }
  return false;
}

function loadState() {
  try { const c = localStorage.getItem(STORAGE_KEY); if (c) state.completed = JSON.parse(c); } catch(e) {}
  try { const s = localStorage.getItem(SET_LOGS_KEY); if (s) state.setLogs = JSON.parse(s); } catch(e) {}
  try { const o = localStorage.getItem(OVERRIDE_KEY); if (o) state.workoutOverride = JSON.parse(o); } catch(e) {}
  try { const p = localStorage.getItem(PR_KEY); if (p) state.prs = JSON.parse(p); } catch(e) {}
  try { const pw = localStorage.getItem(PREV_WEIGHTS_KEY); if (pw) state.prevWeights = JSON.parse(pw); } catch(e) {}
  try { const dur = localStorage.getItem(SESSION_DURATIONS_KEY); if (dur) state.sessionDurations = JSON.parse(dur); } catch(e) {}
  try {
    const notes = localStorage.getItem(SESSION_NOTES_KEY);
    if (notes) {
      const parsed = JSON.parse(notes);
      // Migrate any old day-name keys to their most recent completed date
      const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      for (const dayName of dayNames) {
        if (parsed[dayName]) {
          const matchingDates = Object.keys(state.completed).filter(k => {
            const parts = k.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            return ALL_DAYS[d.getDay()] === dayName;
          }).sort().reverse();
          if (matchingDates.length > 0) {
            // Save under date key only if not already there
            if (!parsed[matchingDates[0]]) parsed[matchingDates[0]] = parsed[dayName];
          }
          delete parsed[dayName]; // remove old day-name key after migrating
        }
      }
      state.sessionNotes = parsed;
      localStorage.setItem(SESSION_NOTES_KEY, JSON.stringify(parsed));
    }
  } catch(e) {}
  try { const vol = localStorage.getItem(VOLUME_KEY); if (vol) state.volume = JSON.parse(vol); } catch(e) {}
  try { const pb = localStorage.getItem(PROG_PB_KEY); if (pb) state.progPBs = JSON.parse(pb); } catch(e) {}
  try { const ce = localStorage.getItem(COMPLETED_EX_KEY); if (ce) state.completedExercises = JSON.parse(ce); } catch(e) {}
  try {
    const ss = localStorage.getItem(SESSION_START_KEY);
    if (ss) {
      try {
        const parsed = JSON.parse(ss);
        if (parsed && typeof parsed === 'object') {
          state.sessionStart = parsed.start || null;
          state.sessionPaused = parsed.paused || false;
          state.sessionElapsedBeforePause = parsed.elapsed || 0;
        } else {
          state.sessionStart = parseInt(ss) || null;
        }
      } catch(e2) {
        state.sessionStart = parseInt(ss) || null;
      }
    }
  } catch(e) {}
}

}

function saveSetLogs() {

function checkProgPB(exKey, peName, value, unit) {
  const pbKey = exKey + '__' + peName;
  const existing = state.progPBs[pbKey];
  if (!existing || value > existing.value) {
    state.progPBs[pbKey] = { value, unit, date: new Date().toLocaleDateString() };
    saveProgPBs();
    return true;
  }
  return false;
}

function saveProgPB(exKey, peName, value, unit) {
  checkProgPB(exKey, peName, parseFloat(value), unit);
  render();
}

function advanceProgPhase(type) {
  const prog = getProgressionPhase(type);
  const phases = type === 'pullup' ? PULLUP_PHASES : PUSHUP_PHASES;
  if (prog.phaseIndex < phases.length - 1) {
    // Store a manual phase override — adds enough "virtual" sessions to push into next phase
    const key = type === 'pullup' ? 'natalia-pullup-phase-override' : 'natalia-pushup-phase-override';
    const newPhase = prog.phaseIndex + 1;
    try { localStorage.setItem(key, newPhase.toString()); } catch(e) {}
    render();
  }
}

function saveVolume() {
  try { localStorage.setItem(VOLUME_KEY, JSON.stringify(state.volume)); } catch(e) {}
}

function saveOverride() {
  try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(state.workoutOverride)); } catch(e) {}
}

// ── Helpers ───────────────────────────────────────────────
function dateKey(d) { return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function todayKey() { return dateKey(new Date()); }
function todayDayName() { return ALL_DAYS[new Date().getDay()]; }
function exKey(dayName, exName) { return dayName + '__' + exName; }

function getLog(dayName, exName, sets) {
  const k = exKey(dayName, exName);
  return state.setLogs[k] || { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
}

  const pills = ALL_DAYS.map(d => {

    const active = d === state.activeDay;
    return `<button class="day-pill${active?' active':''}"
      style="${active ? `background:${c};box-shadow:0 4px 20px ${c}55;border:none` : ''}"
      onclick="setDay('${d}')">${d}</button>`;
  }).join('');

  // Start session timer when on workout tab
  if (!state.sessionStart) {
    state.sessionStart = Date.now();
    saveSessionStart();
  }
  setTimeout(startSessionTimer, 0);

  const content = state.activeDay === 'Sunday' ? buildSunday() : buildWorkoutDay(state.activeDay);
  return `<div class="day-pills">${pills}</div><div>${content}</div>`;

        ${swapOptions}

function buildExercise(ex, dayName, color) {
  const k = exKey(dayName, ex.name);
  const open = !!state.expanded[k];

  // ── Progression exercise (pull-up or push-up phase work) ──
  if (ex.progression) {
    const prog = getProgressionPhase(ex.progression);
    const phases = ex.progression === 'pullup' ? PULLUP_PHASES : PUSHUP_PHASES;
    const phase = phases[prog.phaseIndex];
    const pc = phase.color;

    // set log uses phase exercise count
    const phaseExCount = phase.exercises.length;
    // log sizing handled below after phaseSetCounts computed; use placeholder here
    const doneSets = (() => {
      const l = state.setLogs[k];
      return l ? l.checked.filter(Boolean).length : 0;
    })();
    // Done when ANY single phase exercise has all its sets complete (user does one per day)
    const _psc = phase.exercises.map(pe => parseInt(pe.sets) || 3);
    const _fl = state.setLogs[k];
    const allDone = _fl ? phase.exercises.some((pe, exIdx) => {
      const offset = _psc.slice(0, exIdx).reduce((a, b) => a + b, 0);
      const numSets = _psc[exIdx];
      return Array.from({length: numSets}, (_, s) => _fl.checked[offset + s]).every(Boolean);
    }) : false;

    const bg = allDone ? 'rgba(34,197,94,0.06)' : `rgba(${pc === '#60B8FF' ? '96,184,255' : pc === '#A78BFA' ? '167,139,250' : pc === '#34D399' ? '52,211,153' : pc === '#F59E0B' ? '245,158,11' : '255,107,53'},0.06)`;
    const border = allDone ? '1px solid rgba(34,197,94,0.25)' : `1px solid ${pc}40`;

    // Phase progress dots
    const phaseDots = phases.map((p, i) => {
      const done = i < prog.phaseIndex;
      const cur = i === prog.phaseIndex;
      return `<div style="flex:1;height:3px;border-radius:2px;background:${done ? p.color : (cur ? p.color+'99' : 'rgba(255,255,255,0.1)')}"></div>`;
    }).join('');

    // Session dots within phase
    const sessionDots = Array.from({length: prog.sessionsPerPhase}, (_, i) => {
      const filled = i < prog.sessionsIntoPhase;
      return `<div style="width:7px;height:7px;border-radius:50%;background:${filled ? pc : 'rgba(255,255,255,0.12)'};border:1px solid ${filled ? pc : 'rgba(255,255,255,0.2)'}"></div>`;
    }).join('');

    const nextMsg = prog.phaseIndex < phases.length - 1
      ? `${prog.sessionsUntilNext} session${prog.sessionsUntilNext !== 1 ? 's' : ''} to Phase ${prog.phaseIndex + 2}`
      : '🏆 Final Phase';

    const typeLabel = ex.progression === 'pullup' ? '🏋️ Pull-up' : '💪 Push-up';

    // Phase exercise rows — each with full per-set logging stored flat in one log key
    // Layout: [ex0_set0, ex0_set1, ..., ex1_set0, ex1_set1, ...]
    const phaseSetCounts = phase.exercises.map(pe => parseInt(pe.sets) || 3);
    const totalPhaseSets = phaseSetCounts.reduce((a, b) => a + b, 0);

    // Last session preview for progression exercise
    const progLastSession = buildLastSessionPreview(dayName, ex.name, totalPhaseSets, pc);
    if (!state.setLogs[k] || state.setLogs[k].checked.length !== totalPhaseSets) {
      state.setLogs[k] = { checked: Array(totalPhaseSets).fill(false), weights: Array(totalPhaseSets).fill(''), reps: Array(totalPhaseSets).fill('') };
      saveSetLogs();
    }
    const flatLog = state.setLogs[k];
    const doneFlat = flatLog.checked.filter(Boolean).length;

    const doneExCount = phase.exercises.filter((pe, exIdx) => {
      const offset = phaseSetCounts.slice(0, exIdx).reduce((a, b) => a + b, 0);
      const numSets = phaseSetCounts[exIdx];
      return Array.from({length: numSets}, (_, s) => flatLog.checked[offset + s]).every(Boolean);
    }).length;
    const progressBadge = allDone
      ? '<span class="ex-badge-done">✓ done</span>'
      : (doneExCount > 0 ? `<span class="ex-badge-progress" style="color:${pc}">${doneExCount}/${phaseExCount} exercises</span>` : '');

    const progQuickCompleteBtn = '';

    const phaseExRows = phase.exercises.slice(0, 1).map((pe, exIdx) => {
      const offset = phaseSetCounts.slice(0, exIdx).reduce((a, b) => a + b, 0);
      const numSets = phaseSetCounts[exIdx];

      // Master weight selector for this phase exercise
      const peMasterWeightSelector = buildMasterWeightSelector(`${k}-ex${exIdx}`, numSets, ex.eq);

      const setRows = Array.from({length: numSets}, (_, s) => {
        const fi = offset + s;
        const checked = flatLog.checked[fi] || false;
        const weight = (flatLog.weights[fi] || '').replace(/"/g, '&quot;');

        // Small override button for individual set weight changes
        const hasWeightSelector = ex.eq && (ex.eq.includes('DB') || ex.eq.toLowerCase().includes('band'));
        const overrideBtn = hasWeightSelector ? `<button class="weight-override-btn" onclick="toggleSetWeightPicker('${k}',${fi})" title="Change weight for this set">↻</button>` : '';

        const pickerButtons = hasWeightSelector ? (ex.eq.toLowerCase().includes('band')
          ? BAND_COLORS.map(b => `<button class="weight-btn" style="border-color:${b.hex};color:${b.hex}" onclick="setIndividualWeight('${k}',${fi},'${b.value}')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${b.hex};margin-right:4px;vertical-align:middle"></span>${b.label}</button>`).join('')
          : DB_WEIGHTS.map(w => `<button class="weight-btn" onclick="setIndividualWeight('${k}',${fi},${w})">${w}</button>`).join('')
        ) : '';

        const picker = hasWeightSelector ? `<div id="set-picker-${k}-${fi}" class="set-weight-picker">${pickerButtons}</div>` : '';

        // Auto-fill with target reps from phase exercise
        const targetReps = parseInt((pe.reps || '').toString().split('–')[0]) || '';
        const reps = (flatLog.reps && flatLog.reps[fi]) || targetReps;

        return `<div class="set-row" style="margin-top:5px">
          <button class="set-check${checked ? ' checked' : ''}" onclick="toggleSet('${k}',${fi},this)">${checked ? '✓' : ''}</button>
          <span class="set-label">Set ${s + 1}</span>
          <div class="set-input-group">
            <input id="weight-input-${k}-${fi}" class="set-input set-input-small" type="text" placeholder="lbs" value="${weight}"
              onchange="updateWeight('${k}',${fi},this.value)" oninput="updateWeight('${k}',${fi},this.value)" />
            <input id="reps-input-${k}-${fi}" class="set-input set-input-small" type="number" placeholder="reps" value="${reps}"
              onchange="updateReps('${k}',${fi},this.value)" oninput="updateReps('${k}',${fi},this.value)" />
            <div class="reps-controls">
              <button class="reps-arrow" onclick="adjustReps('${k}',${fi},1)">▲</button>
              <button class="reps-arrow" onclick="adjustReps('${k}',${fi},-1)">▼</button>
            </div>
          </div>
          ${overrideBtn}
        </div>${picker}`;
      }).join('');

      const peAllDone = Array.from({length: numSets}, (_, s) => flatLog.checked[offset + s]).every(Boolean);
      const peBg = peAllDone ? 'rgba(34,197,94,0.08)' : 'rgba(255,255,255,0.04)';
      const peBorder = peAllDone ? '1px solid rgba(34,197,94,0.35)' : '1px solid rgba(255,255,255,0.08)';
      const peDoneBadge = peAllDone ? '<span style="font-size:11px;font-weight:700;color:#22c55e;margin-left:6px">✓ done</span>' : '';

      return `
      <div style="background:${peBg};border:${peBorder};border-radius:10px;padding:10px 12px;margin-bottom:6px;transition:all 0.3s">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-size:13px;font-weight:600;color:${peAllDone ? '#22c55e' : '#fff'}">${pe.name}</span>
            ${peDoneBadge}
          </div>
          <span style="font-size:11px;font-weight:700;background:${pc}22;color:${pc};border-radius:8px;padding:2px 9px;flex-shrink:0;margin-left:8px">${pe.sets} × ${pe.reps}</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.38);margin-bottom:4px">💡 ${pe.note}</div>
        ${peMasterWeightSelector}
        ${setRows}
      </div>`;
    }).join('');

    return `
  <div class="exercise-card" style="background:${bg};border:${border}">
    <div class="exercise-header">
      <div style="flex:1" onclick="toggleExercise('${k}')">
        <div class="exercise-name-row">
          <span class="exercise-name">${ex.name}</span>
          ${progressBadge}
        </div>
        <div class="exercise-tags">
          <span class="tag" style="background:${pc}22;color:${pc}">Phase ${phase.phase} — ${phase.label}</span>
          <span class="tag tag-muted">${ex.eq}</span>
          <span class="tag tag-muted">rest ${ex.rest}</span>
          ${ex.muscles ? `<span class="tag tag-muted tag-target" style="color:rgba(255,255,255,0.55)" onclick="event.stopPropagation();openMuscleModal('${ex.name.replace(/'/g,"\\'")}','${ex.muscles}')">🎯 ${ex.muscles}</span>` : ''}
        </div>
      </div>
      <div class="exercise-quick-actions">
        <button class="quick-action-btn" onclick="event.stopPropagation();copyLastWeek('${k}',${totalPhaseSets})" title="Copy last session's weights">📋</button>
        <button class="quick-action-btn" onclick="event.stopPropagation();skipExercise('${k}')" title="Skip this exercise">⏭️</button>
      </div>
      <span class="chevron" onclick="toggleExercise('${k}')" style="cursor:pointer;padding:0 8px">${open ? '▲' : '▼'}</span>
    </div>
    <div id="sets-${k}" style="display:${open ? 'flex' : 'none'};flex-direction:column;gap:0;margin-top:12px">
      <div style="display:flex;gap:3px;margin-bottom:8px">${phaseDots}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="display:flex;gap:5px;align-items:center">${sessionDots}</div>
        <div style="font-size:11px;font-weight:600;color:${pc}">Session ${prog.sessionsIntoPhase + 1} of ${prog.sessionsPerPhase}</div>
      </div>
      <div style="font-size:10px;color:rgba(255,255,255,0.28);margin-bottom:10px">${nextMsg}</div>
      ${prog.sessionsUntilNext === 0 && prog.phaseIndex < phases.length - 1 ? `
        <button onclick="advanceProgPhase('${ex.progression}')" style="width:100%;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.4);border-radius:10px;color:#22c55e;font-size:13px;font-weight:700;padding:10px;cursor:pointer;margin-bottom:10px;font-family:'DM Sans',sans-serif">
          🚀 Ready to advance → Phase ${prog.phaseIndex + 2}
        </button>` : ''}
      ${progLastSession}
      ${progQuickCompleteBtn}
      ${phaseExRows}
      ${(() => {
        const pe = phase.exercises[0];
        const pbKey = k + '__' + pe.name;
        const pb = state.progPBs[pbKey];
        const unit = pe.reps && pe.reps.includes('sec') ? 'sec' : 'reps';
        const pbDisplay = pb ? `<span style="color:${pc};font-weight:700">🏆 Best: ${pb.value}${unit} <span style="font-size:9px;opacity:0.5">${pb.date}</span></span>` : `<span style="color:rgba(255,255,255,0.3)">No PB yet</span>`;
        return `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;margin-bottom:4px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.07)">
          <div style="font-size:11px;flex:1">${pbDisplay}</div>
          <input type="number" id="prog-pb-input-${k}" placeholder="Log PB (${unit})" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:7px;padding:5px 9px;color:#fff;font-size:12px;width:120px;outline:none;font-family:'DM Sans',sans-serif" />
          <button onclick="saveProgPB('${k}','${pe.name.replace(/'/g,"\\'")}',document.getElementById('prog-pb-input-${k}').value,'${unit === 'sec' ? 'sec' : 'reps'}')" style="background:${pc}22;border:1px solid ${pc}55;border-radius:7px;color:${pc};font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">Save</button>
        </div>`;
      })()}
      ${phase.exercises.length > 1 ? `<div style="font-size:11px;color:rgba(255,255,255,0.25);margin-top:4px;margin-bottom:6px">Next up: ${phase.exercises.slice(1).map(e => e.name).join(' → ')}</div>` : ''}
      <div style="background:${pc}10;border-left:3px solid ${pc};border-radius:0 8px 8px 0;padding:8px 11px;margin-top:4px">
        <div style="font-size:10px;color:${pc};font-weight:700;margin-bottom:2px">Coach note</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);line-height:1.6">${phase.tip}</div>
      </div>
    </div>
  </div>`;
  }

  // ── Standard exercise ──
  const log = getLog(dayName, ex.name, ex.sets);
  const doneSets = log.checked.filter(Boolean).length;
  const allDone = doneSets === ex.sets;

  const bg = allDone ? 'rgba(34,197,94,0.06)' : 'rgba(255,255,255,0.05)';
  const border = allDone ? '1px solid rgba(34,197,94,0.25)' : '1px solid rgba(255,255,255,0.08)';

  const progressBadge = allDone
    ? '<span class="ex-badge-done">✓ done</span>'
    : (doneSets > 0 ? `<span class="ex-badge-progress" style="color:${color}">${doneSets}/${ex.sets}</span>` : '');

  const prevW = state.prevWeights[k] || [];
  const prInfo = state.prs[k];

  // Last session preview
  const lastSessionPreview = buildLastSessionPreview(dayName, ex.name, ex.sets, color);

  // Master weight selector (shows once at top)
  const masterWeightSelector = buildMasterWeightSelector(k, ex.sets, ex.eq);

  // Quick complete button
  const allSetsComplete = log.checked.every(Boolean);
  const quickCompleteBtn = !allSetsComplete ? `
    <button onclick="markAllSetsComplete('${k}',${ex.sets})" style="width:100%;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:10px;color:#22c55e;font-size:12px;font-weight:600;padding:8px;cursor:pointer;margin-bottom:10px;font-family:'DM Sans',sans-serif;transition:all 0.2s">
      ✅ Mark all ${ex.sets} sets complete
    </button>` : '';

  const sets = Array.from({length: ex.sets}, (_, s) => {
    const checked = log.checked[s] || false;
    const weight = (log.weights[s] || '').replace(/"/g, '&quot;');
    const hint = (!weight && prevW[s]) ? prevW[s] : '';

    // Small override button for individual set weight changes
    const hasWeightSelector = ex.eq && (ex.eq.includes('DB') || ex.eq.toLowerCase().includes('band'));
    const overrideBtn = hasWeightSelector ? `<button class="weight-override-btn" onclick="toggleSetWeightPicker('${k}',${s})" title="Change weight for this set">↻</button>` : '';

    const pickerButtons = hasWeightSelector ? (ex.eq.toLowerCase().includes('band')
      ? BAND_COLORS.map(b => `<button class="weight-btn" style="border-color:${b.hex};color:${b.hex}" onclick="setIndividualWeight('${k}',${s},'${b.value}')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${b.hex};margin-right:4px;vertical-align:middle"></span>${b.label}</button>`).join('')
      : DB_WEIGHTS.map(w => `<button class="weight-btn" onclick="setIndividualWeight('${k}',${s},${w})">${w}</button>`).join('')
    ) : '';

    const picker = hasWeightSelector ? `<div id="set-picker-${k}-${s}" class="set-weight-picker">${pickerButtons}</div>` : '';

    // Auto-fill with target reps if not already set
    const targetReps = parseInt((ex.reps || '').toString().split('–')[0]) || '';
    const reps = (log.reps && log.reps[s]) || targetReps;

    return `<div class="set-row">
      <button class="set-check${checked?' checked':''}" onclick="toggleSet('${k}',${s},this)">${checked?'✓':''}</button>
      <span class="set-label">Set ${s+1}</span>
      <div class="set-input-group">
        <input id="weight-input-${k}-${s}" class="set-input set-input-small" type="text" placeholder="${hint || (ex.eq && ex.eq.toLowerCase().includes('band') ? 'band' : 'lbs')}" value="${weight}"
          onchange="updateWeight('${k}',${s},this.value)" oninput="updateWeight('${k}',${s},this.value)" />
        <input id="reps-input-${k}-${s}" class="set-input set-input-small" type="number" placeholder="reps" value="${reps}"
          onchange="updateReps('${k}',${s},this.value)" oninput="updateReps('${k}',${s},this.value)" />
        <div class="reps-controls">
          <button class="reps-arrow" onclick="adjustReps('${k}',${s},1)">▲</button>
          <button class="reps-arrow" onclick="adjustReps('${k}',${s},-1)">▼</button>
        </div>
      </div>
      ${overrideBtn}
    </div>${picker}`;
  }).join('');
  const prBadge = prInfo ? `<span class="pr-badge">🏆 PR: ${prInfo.weight} lbs</span>` : '';

  return `
  <div class="exercise-card" style="background:${bg};border:${border}">
    <div class="exercise-header">
      <div style="flex:1" onclick="toggleExercise('${k}')">
        <div class="exercise-name-row">
          <span class="exercise-name">${ex.name}</span>
          ${progressBadge}
          ${prBadge}
        </div>
        <div class="exercise-tags">
          <span class="tag" style="background:${color}22;color:${color}">${ex.sets} sets × ${ex.reps}</span>
          <span class="tag tag-muted">${ex.eq}</span>
          <span class="tag tag-muted">rest ${ex.rest}</span>
          ${ex.muscles ? `<span class="tag tag-muted tag-target" style="color:rgba(255,255,255,0.55)" onclick="event.stopPropagation();openMuscleModal('${ex.name.replace(/'/g,"\\'")}','${ex.muscles}')">🎯 ${ex.muscles}</span>` : ''}
        </div>
      </div>
      <div class="exercise-quick-actions">
        <button class="quick-action-btn" onclick="event.stopPropagation();copyLastWeek('${k}',${ex.sets})" title="Copy last session's weights">📋</button>
        <button class="quick-action-btn" onclick="event.stopPropagation();skipExercise('${k}')" title="Skip this exercise">⏭️</button>
      </div>
      <span class="chevron" onclick="toggleExercise('${k}')" style="cursor:pointer;padding:0 8px">${open ? '▲' : '▼'}</span>
    </div>
    <div id="sets-${k}" style="display:${open?'flex':'none'};flex-direction:column;gap:6px;margin-top:10px">
      ${lastSessionPreview}
      ${ex.setup ? `<div style="margin-bottom:8px">
        <button onclick="toggleSetup('${k}')" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;font-family:'DM Sans',sans-serif">
          <span>👁️ ${state.setupVisible[k] ? 'Hide' : 'Show'} setup & cues</span>
          <span style="font-size:10px">${state.setupVisible[k] ? '▲' : '▼'}</span>
        </button>
        <div id="setup-${k}" style="display:${state.setupVisible[k] ? 'block' : 'none'};background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:10px;padding:11px 13px;margin-top:6px">
          <div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">Setup &amp; Cues</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.55);line-height:1.8">${ex.setup}</div>
        </div>
      </div>` : ''}
      ${masterWeightSelector}
      ${quickCompleteBtn}
      ${sets}
    </div>
  </div>`;
}

}

// ── Sunday ────────────────────────────────────────────────
function buildSunday() {
  // If user has swapped Sunday to a workout day, show that workout instead
  const todayDateKey = todayKey();
  const override = state.workoutOverride[todayDateKey];
  if (state.activeDay === 'Sunday' && override && override !== 'Sunday') {
    return buildWorkoutDay('Sunday');
  }

  const s = PLAN.Sunday;
  const c = s.color;
  const complete = !!state.completed[todayKey()];

  let stretchIdx = 0;
  const sections = s.sections.map(sec => {
    const moves = sec.moves.map(m => {
      const sid = 'stretch-' + (stretchIdx++);
      // parse seconds from hold string
      let secs = 0;
      const secM = m.hold.match(/(\d+)\s*sec/);
      const minM = m.hold.match(/(\d+)\s*min/);

function buildProgressionOverview() {

  function miniPhaseBar(phases, idx) {
    return phases.map((p, i) => {
      const done = i < idx;

      const w = cur ? 'font-weight:700' : '';
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="width:100%;height:5px;border-radius:3px;background:${done ? p.color : (cur ? p.color+'99' : 'rgba(255,255,255,0.1)')}"></div>
        <span style="font-size:8px;color:${cur ? p.color : 'rgba(255,255,255,0.2)'};${w}">P${p.phase}</span>

function buildCalendar() {
  const today = new Date();
  const year  = state.calYear;
  const month = state.calMonth;
  const monthName = new Date(year, month, 1).toLocaleString('default', { month: 'long' });
  const firstDay  = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const tKey = todayKey();

  const labels = DAY_ABBR.map(d => `<div class="cal-day-label">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key  = dateKey(date);
    const isToday = key === tKey;
    const dayName = ALL_DAYS[date.getDay()];
    const completedVal = state.completed[key];
    const completed = !!completedVal;
    const isFuture = date > today && !isToday;
    // Color: use stored workout if completed, else check date-specific override, else default
    const planDay = completed ? completedVal
      : (state.workoutOverride[key] ? state.workoutOverride[key] : dayName);
    const ac = planDay === 'Sunday' ? '#60B8FF' : (PLAN[planDay] ? PLAN[planDay].color : '#ffffff');

    let cellStyle = isFuture ? 'opacity:0.35;' : '';
    let numStyle  = 'color:rgba(255,255,255,0.6)';
    if (completed) { cellStyle += `background:${ac}30;border:1.5px solid ${ac}77;`; numStyle = `color:${ac};font-weight:${isToday?800:500}`; }
    else if (isToday) { cellStyle += 'background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.35);'; numStyle = 'color:#fff;font-weight:800'; }

    cells += `<div class="cal-cell" style="${cellStyle}" onclick="calToggle('${key}','${dayName}')">
      <span class="cal-num" style="${numStyle}">${d}</span>
      <div class="cal-dot" style="background:${completed ? ac : ac+'44'}"></div>
      ${completed ? `<span class="cal-check" style="color:${ac}">✓</span>` : ''}
    </div>`;
  }

  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
  let thisWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    if (state.completed[dateKey(d)]) thisWeek++;
  }
  const total = Object.values(state.completed).filter(Boolean).length;

  // Weekly stats
  let thisWeekVol = 0;
  let thisWeekDuration = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const dk = dateKey(d);
    if (state.completed[dk]) {
      thisWeekVol += state.volume[dk] || 0;
      thisWeekDuration += state.sessionDurations[dk] || 0;
    }
  }
  const totalVol = Object.keys(state.volume).reduce((a, k) => a + (state.volume[k] || 0), 0);
  const avgDuration = (() => {
    const durs = Object.values(state.sessionDurations).filter(v => v > 0);
    if (!durs.length) return 0;
    return Math.round(durs.reduce((a, v) => a + v, 0) / durs.length);
  })();
  const fmtDur = (sec) => sec > 0 ? `${Math.floor(sec/60)}m` : '—';
  const fmtVol = (lbs) => lbs > 0 ? (lbs >= 1000 ? (lbs/1000).toFixed(1)+'k' : lbs+'') + ' lbs' : '—';

  // Build muscle heatmap for this week
  const muscleMap = buildMuscleHeatmap(monday);
  const heatmapHTML = buildHeatmapHTML(muscleMap);

  return `
  <div class="calendar-wrap">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">&#8249;</button>
      <div class="cal-month">${monthName} ${year}</div>
      <button class="cal-nav-btn" onclick="calNext()">&#8250;</button>
    </div>
    <div class="cal-grid">${labels}${cells}</div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,0.4)"></div><span class="legend-label">Today</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div><span class="legend-label">Completed</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#60B8FF"></div><span class="legend-label">Stretch (Sun)</span></div>
    </div>
    <div class="streak-row">
      <div class="streak-box"><div class="streak-num" style="color:#F59E0B">${thisWeek}</div><div class="streak-lbl">This week</div></div>
      <div class="streak-box"><div class="streak-num" style="color:#A78BFA">${total}</div><div class="streak-lbl">Total sessions</div></div>
      <div class="streak-box"><div class="streak-num" style="color:#34D399;font-size:18px">${fmtDur(avgDuration)}</div><div class="streak-lbl">Avg duration</div></div>
    </div>
  </div>

  <!-- Streak Counter -->
  <div style="background:linear-gradient(135deg,rgba(239,68,68,0.12),rgba(245,158,11,0.08));border:1px solid rgba(239,68,68,0.25);border-radius:16px;padding:16px;margin-bottom:16px;text-align:center">
    <div style="font-size:48px;margin-bottom:8px">🔥</div>
    <div style="display:flex;gap:20px;justify-content:center;align-items:center">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:#ef4444;line-height:1">${calculateStreaks().current}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-top:4px">Day Streak</div>
      </div>
      <div style="width:1px;height:50px;background:rgba(255,255,255,0.1)"></div>
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:#F59E0B;line-height:1">Best: ${calculateStreaks().longest}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px">Longest streak</div>
      </div>
    </div>
  </div>

  <!-- Weekly Summary -->
  <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;margin-bottom:16px">
    <div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:12px">📊 This Week's Summary</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Volume lifted</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#FF6B35">${fmtVol(thisWeekVol)}</div>
      </div>
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Time trained</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#60B8FF">${fmtDur(thisWeekDuration)}</div>
      </div>
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">All-time volume</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#A78BFA">${fmtVol(totalVol)}</div>
      </div>
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Sessions logged</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#34D399">${total}</div>

    </div>
  </div>
  ${heatmapHTML}
  ${buildProgressionOverview()}`;
}

// ── Last Session Preview ───────────────────────────────────
function getLastSessionData(dayName, exName, currentSets) {
  // Find the last time this specific day was completed
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const completedDates = Object.entries(state.completed)
    .filter(([key, planDay]) => planDay === dayName)
    .map(([key]) => {
      const parts = key.split('-');
      return { key, date: new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2])) };
    })
    .filter(({ date }) => date < today)
    .sort((a, b) => b.date - a.date);

  if (!completedDates.length) return null;

  const lastSession = completedDates[0];
  const k = exKey(dayName, exName);
  const log = state.setLogs[k];

  if (!log || !log.weights.some(w => w)) return null;

  // Calculate stats
  const weights = log.weights.slice(0, currentSets);
  const checked = log.checked.slice(0, currentSets);
  const weightValues = weights.map(w => parseFloat(w)).filter(n => !isNaN(n) && n > 0);

  if (!weightValues.length) return null;

  const avgWeight = weightValues.reduce((a, b) => a + b, 0) / weightValues.length;
  const completedSets = checked.filter(Boolean).length;
  const allComplete = completedSets === currentSets;

  // Calculate days ago
  const daysAgo = Math.floor((today - lastSession.date) / (1000 * 60 * 60 * 24));
  const dateStr = daysAgo === 7 ? '7 days ago' : (daysAgo === 1 ? 'yesterday' : `${daysAgo} days ago`);

  // Build reps display
  const repsDisplay = weights.map((w, i) => w ? (checked[i] ? '✓' : '○') : '—').join(', ');

  // Calculate volume (estimate based on weight)
  const day = PLAN[dayName];
  const ex = day?.exercises?.find(e => e.name === exName);
  const repsPerSet = ex ? parseInt((ex.reps || '').toString().split('–')[0]) || 10 : 10;
  const volume = Math.round(weightValues.reduce((sum, w) => sum + (w * repsPerSet), 0));

  // Smart suggestion
  let suggestion = '';
  if (allComplete && avgWeight > 0) {
    const nextWeight = DB_WEIGHTS.find(w => w > avgWeight);
    if (nextWeight) {
      suggestion = `💡 All sets complete! Ready to try ${nextWeight} lbs today`;
    } else {
      suggestion = `💪 Max weight! Consider adding reps or slowing tempo`;
    }
  } else if (completedSets > 0 && completedSets < currentSets) {
    suggestion = `💡 Keep ${avgWeight.toFixed(2)} lbs, aim for all ${currentSets} sets today`;
  } else if (completedSets === 0) {
    suggestion = `💡 Last time was challenging — consider ${avgWeight.toFixed(2)} lbs or lighter`;
  }

  return {
    date: lastSession.date,
    dateStr,
    daysAgo,
    weight: avgWeight.toFixed(2),
    weights,
    repsDisplay,
    completedSets,
    totalSets: currentSets,
    allComplete,
    volume,
    suggestion
  };
}

function getLastCompletedDateForDay(planDay) {
  // Find the most recent completed date for this plan day (excluding today)
  const tKey = todayKey();
  return Object.keys(state.completed)
    .filter(k => k !== tKey && state.completed[k] === planDay)
    .sort().reverse()[0] || null;
}

function buildSkippedExercisesBanner(planDay) {
  const lastDateKey = getLastCompletedDateForDay(planDay);
  if (!lastDateKey) return '';
  const day = PLAN[planDay];
  if (!day || !day.exercises) return '';

  const skipped = day.exercises.filter(ex => {
    const snapKey = lastDateKey + '__' + planDay + '__' + ex.name;
    // Only show as skipped if we have a snapshot and it's explicitly false
    return state.completedExercises[snapKey] === false;
  }).map(ex => ex.name);

  if (!skipped.length) return '';

  const color = day.color;
  return `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:10px 14px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:#F59E0B;margin-bottom:4px">⚠️ Skipped last session:</div>
    <div style="font-size:12px;color:rgba(255,255,255,0.5)">${skipped.join(' · ')}</div>
  </div>`;
}

function buildLastSessionPreview(dayName, exName, numSets, color) {
  const data = getLastSessionData(dayName, exName, numSets);
  if (!data) return '';

  const checkmark = data.allComplete ? '✓' : `${data.completedSets}/${data.totalSets}`;
  const borderColor = data.allComplete ? 'rgba(34,197,94,0.3)' : 'rgba(245,158,11,0.3)';
  const bgColor = data.allComplete ? 'rgba(34,197,94,0.08)' : 'rgba(245,158,11,0.08)';

  return `<div style="background:${bgColor};border:1px solid ${borderColor};border-radius:10px;padding:10px 12px;margin-bottom:10px">
    <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:4px">📅 Last session (${data.dateStr})</div>
    <div style="font-size:13px;color:#fff;font-weight:600;margin-bottom:3px">${data.weight} lbs • ${data.repsDisplay} ${checkmark}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:${data.suggestion ? '4px' : '0'}">Volume: ${data.volume} lbs</div>
    ${data.suggestion ? `<div style="font-size:11px;color:${color};line-height:1.5;margin-top:4px">${data.suggestion}</div>` : ''}
  </div>`;
}

// ── Weight selector for DB/Band exercises ──────────────────
const DB_WEIGHTS = [3.85, 6.35, 8.85, 11.35]; // Bar only, +1.25, +2.5, +all
const BAND_COLORS = [
  { label: 'Yellow',  value: 'Yellow',  range: '5–15 lbs',   hex: '#eab308' },
  { label: 'Black',   value: 'Black',   range: '15–35 lbs',  hex: '#6b7280' },
  { label: 'Green',   value: 'Green',   range: '25–65 lbs',  hex: '#22c55e' },
  { label: 'Red',     value: 'Red',     range: '50–125 lbs', hex: '#ef4444' },
];

function buildMasterWeightSelector(k, numSets, equipment) {
  if (!equipment || (!equipment.includes('DB') && !equipment.toLowerCase().includes('band'))) {
    return '';
  }

  const isBand = equipment.toLowerCase().includes('band');

  if (isBand) {
    const buttons = BAND_COLORS.map(b =>
      `<button class="weight-btn" style="border-color:${b.hex};color:${b.hex}" onclick="setAllWeights('${k}',${numSets},'${b.value}')">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${b.hex};margin-right:4px;vertical-align:middle"></span>${b.label}<span style="font-size:9px;opacity:0.6;margin-left:4px">${b.range}</span>
      </button>`
    ).join('');
    return `<div style="margin-bottom:8px">
      <div style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">Band color for all sets</div>
      <div class="weight-quick-select">${buttons}</div>
    </div>`;
  }

  const buttons = DB_WEIGHTS.map(w =>
    `<button class="weight-btn" onclick="setAllWeights('${k}',${numSets},${w})">${w} lbs</button>`
  ).join('');

  return `<div style="margin-bottom:8px">
    <div style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px">Set weight for all sets</div>
    <div class="weight-quick-select">${buttons}</div>
  </div>`;
}

function setAllWeights(k, numSets, weight) {
  // Handle phase exercise keys (e.g., "Monday__Pull-up Bar Work-ex0")
  const baseKey = k.replace(/-ex\d+$/, ''); // Remove "-ex0", "-ex1" etc. if present
  const isPhaseEx = k !== baseKey;

  if (isPhaseEx) {
    // For phase exercises, we need to find the offset for this specific exercise
    const exMatch = k.match(/-ex(\d+)$/);
    if (!exMatch) return;

    const exIdx = parseInt(exMatch[1]);

    // Get total sets before this exercise to calculate offset
    const parts = baseKey.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const day = PLAN[dayName];
    const exercise = day?.exercises?.find(e => e.name === exName);

    if (exercise?.progression) {
      const prog = getProgressionPhase(exercise.progression);
      const phases = exercise.progression === 'pullup' ? PULLUP_PHASES : PUSHUP_PHASES;
      const phase = phases[prog.phaseIndex];
      const phaseSetCounts = phase.exercises.map(pe => parseInt(pe.sets) || 3);
      const offset = phaseSetCounts.slice(0, exIdx).reduce((a, b) => a + b, 0);

      // Ensure log exists
      const totalPhaseSets = phaseSetCounts.reduce((a, b) => a + b, 0);
      if (!state.setLogs[baseKey]) {
        state.setLogs[baseKey] = { checked: Array(totalPhaseSets).fill(false), weights: Array(totalPhaseSets).fill(''), reps: Array(totalPhaseSets).fill('') };
      }

      // Set weights for this phase exercise's sets
      for (let i = 0; i < numSets; i++) {
        const fi = offset + i;
        state.setLogs[baseKey].weights[fi] = weight.toString();
        const input = document.getElementById(`weight-input-${baseKey}-${fi}`);
        if (input) input.value = weight;
      }
    }
  } else {
    // Standard exercise
    if (!state.setLogs[k]) {
      const parts = k.split('__');
      const dayName = parts[0];
      const exName = parts.slice(1).join('__');
      state.setLogs[k] = { checked: Array(numSets).fill(false), weights: Array(numSets).fill(''), reps: Array(numSets).fill('') };
    }

    // Set all weights to the selected value
    for (let i = 0; i < numSets; i++) {
      state.setLogs[k].weights[i] = weight.toString();
      const input = document.getElementById(`weight-input-${k}-${i}`);
      if (input) input.value = weight;
    }
  }

  saveSetLogs();
}

function toggleSetWeightPicker(k, idx) {
  const picker = document.getElementById(`set-picker-${k}-${idx}`);
  if (!picker) return;

  // Close all other pickers
  document.querySelectorAll('.set-weight-picker.open').forEach(p => {
    if (p !== picker) p.classList.remove('open');
  });

  picker.classList.toggle('open');
}

function setIndividualWeight(k, idx, weight) {
  if (!state.setLogs[k]) {
    const parts = k.split('__');
    const dayName = parts[0];
    const exName = parts.slice(1).join('__');
    const sets = getExSetsCount(dayName, exName);
    state.setLogs[k] = { checked: Array(sets).fill(false), weights: Array(sets).fill(''), reps: Array(sets).fill('') };
  }

  state.setLogs[k].weights[idx] = weight.toString();
  const input = document.getElementById(`weight-input-${k}-${idx}`);
  if (input) input.value = weight;

  // Close picker
  const picker = document.getElementById(`set-picker-${k}-${idx}`);
  if (picker) picker.classList.remove('open');

  saveSetLogs();
}
